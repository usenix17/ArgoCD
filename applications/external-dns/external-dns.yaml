---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: external-dns
---
# ClusterRole gives ExternalDNS read access to Ingress and Service resources
# across all namespaces so it can discover hostnames to register.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
rules:
- apiGroups: [""]
  resources: ["services", "endpoints", "pods", "nodes"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["extensions", "networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "watch", "list"]
# Traefik IngressRoute CRDs (traefik-proxy source) -- e.g. the Proxmox LB,
# which needs a ServersTransport (IngressRoute-only) so can't be a plain Ingress.
- apiGroups: ["traefik.io", "traefik.containo.us"]
  resources: ["ingressroutes", "ingressroutetcps", "ingressrouteudps"]
  verbs: ["get", "watch", "list"]
# DNSEndpoint CRs (crd source) -- used for DDNS records like the WAN-tracked oma.
- apiGroups: ["externaldns.k8s.io"]
  resources: ["dnsendpoints"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["externaldns.k8s.io"]
  resources: ["dnsendpoints/status"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
- kind: ServiceAccount
  name: external-dns
  namespace: external-dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
      - name: external-dns
        image: registry.k8s.io/external-dns/external-dns:v0.15.1
        args:
        - --source=ingress
        - --source=service
        - --source=traefik-proxy
        # DNSEndpoint CRs (DDNS -- e.g. oma tracks the WAN IP via a CronJob)
        - --source=crd
        - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
        - --crd-source-kind=DNSEndpoint
        # Only watch traefik.io (v3) IngressRoutes. Without this, the source also
        # tries the legacy traefik.containo.us (v2) group, whose CRD doesn't
        # exist here -> the informer never syncs and ExternalDNS crash-loops.
        - --traefik-disable-legacy
        # Only manage records within starnix.net
        - --domain-filter=starnix.net
        - --provider=rfc2136
        # Knot DNS MetalLB IP
        - --rfc2136-host=192.168.7.211
        - --rfc2136-port=53
        - --rfc2136-zone=starnix.net
        - --rfc2136-tsig-keyname=externaldns
        # Secret injected via env var below
        - --rfc2136-tsig-secret=$(EXTERNAL_DNS_RFC2136_TSIG_SECRET)
        - --rfc2136-tsig-secret-alg=hmac-sha256
        # TXT records track which records ExternalDNS owns; prefix avoids
        # colliding with application TXT records.
        - --txt-owner-id=external-dns-cluster
        - --txt-prefix=_externaldns-
        - --policy=sync
        - --interval=30s
        - --log-level=info
        env:
        - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
          valueFrom:
            secretKeyRef:
              name: external-dns-secrets
              key: EXTERNAL_DNS_RFC2136_TSIG_SECRET
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
# external-dns-secrets: synced from OpenBao secret/cluster/external-dns-secrets via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-secrets
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: external-dns-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/external-dns-secrets
