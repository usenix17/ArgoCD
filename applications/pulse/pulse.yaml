---
# Pulse server: unified monitoring dashboard (Proxmox + k8s + Docker).
# Web UI + agent endpoint on :7655. State/config on Longhorn (NOT NFS).
# Proxmox nodes are added post-deploy in the web UI with a read-only API token.
# pulse-secrets (OpenBao secret/cluster/pulse-secrets) holds API_TOKENS -- the
# shared token agents present as PULSE_TOKEN. Seed it before first sync:
#   vault kv put secret/cluster/pulse-secrets API_TOKENS="<generate a long token>"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pulse-secrets
  namespace: pulse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: pulse-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/pulse-secrets
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulse-data
  namespace: pulse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse
  namespace: pulse
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO Longhorn PVC -- avoid Multi-Attach on upgrade
  selector:
    matchLabels:
      app: pulse
  template:
    metadata:
      labels:
        app: pulse
    spec:
      securityContext:
        fsGroup: 1000          # let the server write /data
      containers:
        - name: pulse
          image: rcourtman/pulse:v6.4.1
          ports:
            - { name: http, containerPort: 7655 }
          env:
            - name: API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: pulse-secrets
                  key: API_TOKENS
            # Native OIDC against Authentik (Community SSO; env vars lock the
            # SSO fields in the UI = GitOps-owned). Secret lives in OpenBao
            # cluster/pulse-secrets; provider is blueprint-managed (pulse-oidc).
            - name: OIDC_ISSUER_URL
              value: "https://auth.starnix.net/application/o/pulse/"
            - name: OIDC_CLIENT_ID
              value: "pulse"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pulse-secrets
                  key: OIDC_CLIENT_SECRET
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /, port: 7655 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pulse-data
---
apiVersion: v1
kind: Service
metadata:
  name: pulse
  namespace: pulse
  labels:
    app: pulse
spec:
  selector:
    app: pulse
  ports:
    - { name: http, port: 7655, targetPort: 7655 }
---
# Auth is native OIDC in Pulse itself (see OIDC_* env on the Deployment) -- no
# Traefik forward-auth layer, so agent endpoints (/install.sh, /api/*) work
# without SSO exclusions and are guarded by Pulse's own API tokens.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse
  namespace: pulse
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: pulse.starnix.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulse
                port:
                  number: 7655
  tls:
    - secretName: pulse-tls
      hosts:
        - pulse.starnix.net
