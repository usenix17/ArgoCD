# rackpeek -- homelab infrastructure documentation (https://github.com/timmoth/rackpeek)
#
# State is plain YAML in /app/config (Longhorn PVC). rackpeek's NATIVE git
# integration (GIT_TOKEN/GIT_USERNAME env) auto-inits a git repo inside
# /app/config, then commits and syncs every change over HTTPS. The remote
# (https://github.com/usenix17/rackpeek-data.git, private) is wired up ONCE in
# the UI via the Git status indicator -> "Add Remote"; it persists in
# .git/config on the PVC.
#
# Secret seeding (one-time, before first sync):
#   GitHub -> Settings -> Developer settings -> Fine-grained tokens:
#   repo usenix17/rackpeek-data only, permission Contents: Read and write.
#   vault kv put secret/cluster/rackpeek-secrets \
#     GIT_TOKEN=<token> GIT_USERNAME=usenix17
#
# Restore drill (PVC lost): scale deploy to 0, recreate PVC, clone
# rackpeek-data into /app/config (or copy config.yaml in), scale up, re-add
# the remote in the UI if .git was not restored.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rackpeek-secrets
  namespace: rackpeek
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: rackpeek-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/rackpeek-secrets
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rackpeek-config
  namespace: rackpeek
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rackpeek
  namespace: rackpeek
  labels:
    app: rackpeek
spec:
  replicas: 1
  # RWO Longhorn volume: RollingUpdate would Multi-Attach deadlock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rackpeek
  template:
    metadata:
      labels:
        app: rackpeek
    spec:
      securityContext:
        # Image runs as 1654:1654; fsGroup lets it write the PVC (incl. .git).
        fsGroup: 1654
      containers:
        - name: rackpeek
          image: aptacode/rackpeek:v2.1.0
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            # Provides GIT_TOKEN + GIT_USERNAME for the native git sync.
            - secretRef:
                name: rackpeek-secrets
          volumeMounts:
            - name: config
              mountPath: /app/config
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: rackpeek-config
---
apiVersion: v1
kind: Service
metadata:
  name: rackpeek
  namespace: rackpeek
  labels:
    app: rackpeek
spec:
  selector:
    app: rackpeek
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rackpeek
  namespace: rackpeek
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - rackpeek.starnix.net
      secretName: rackpeek-tls
  rules:
    - host: rackpeek.starnix.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rackpeek
                port:
                  number: 8080
