---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-manager-config
  namespace: wazuh
data:
  ossec.conf: |
    <ossec_config>
      <global>
        <jsonout_output>yes</jsonout_output>
        <alerts_log>yes</alerts_log>
        <logall>no</logall>
        <logall_json>yes</logall_json>
        <email_notification>no</email_notification>
        <agents_disconnection_time>10m</agents_disconnection_time>
        <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
      </global>

      <alerts>
        <log_alert_level>3</log_alert_level>
        <email_alert_level>12</email_alert_level>
      </alerts>

      <logging>
        <log_format>plain</log_format>
      </logging>

      <remote>
        <connection>secure</connection>
        <port>1514</port>
        <protocol>tcp</protocol>
        <queue_size>131072</queue_size>
      </remote>

      <remote>
        <connection>syslog</connection>
        <port>514</port>
        <protocol>udp</protocol>
        <allowed-ips>192.168.0.0/16</allowed-ips>
        <!-- Pod CIDR: in-cluster senders (Fluent Bit -> Authentik/Traefik logs)
             reach the LB with their pod source IP preserved, not a node IP. -->
        <allowed-ips>10.244.0.0/16</allowed-ips>
      </remote>

      <rootcheck>
        <disabled>no</disabled>
        <check_files>yes</check_files>
        <check_trojans>yes</check_trojans>
        <check_dev>yes</check_dev>
        <check_sys>yes</check_sys>
        <check_pids>yes</check_pids>
        <check_ports>yes</check_ports>
        <check_if>yes</check_if>
        <frequency>43200</frequency>
        <rootkit_files>etc/rootcheck/rootkit_files.txt</rootkit_files>
        <rootkit_trojans>etc/rootcheck/rootkit_trojans.txt</rootkit_trojans>
        <skip_nfs>yes</skip_nfs>
      </rootcheck>

      <wodle name="syscollector">
        <disabled>no</disabled>
        <interval>1h</interval>
        <scan_on_start>yes</scan_on_start>
        <hardware>yes</hardware>
        <os>yes</os>
        <network>yes</network>
        <packages>yes</packages>
        <ports all="yes">yes</ports>
        <processes>yes</processes>
        <synchronization>
          <max_eps>10</max_eps>
        </synchronization>
      </wodle>

      <sca>
        <enabled>yes</enabled>
        <scan_on_start>yes</scan_on_start>
        <interval>12h</interval>
        <skip_nfs>yes</skip_nfs>
      </sca>

      <vulnerability-detection>
        <enabled>yes</enabled>
        <index-status>yes</index-status>
        <feed-update-interval>60m</feed-update-interval>
      </vulnerability-detection>

      <indexer>
        <enabled>yes</enabled>
        <hosts>
          <!-- Use wazuh.indexer (matches the node cert SAN); the indexer
               connector does full TLS hostname verification, unlike filebeat.
               wazuh.indexer resolves via the pod hostAliases below. -->
          <host>https://wazuh.indexer:9200</host>
        </hosts>
        <ssl>
          <certificate_authorities>
            <ca>/etc/ssl/root-ca.pem</ca>
          </certificate_authorities>
          <certificate>/etc/ssl/filebeat.pem</certificate>
          <key>/etc/ssl/filebeat-key.pem</key>
        </ssl>
      </indexer>

      <syscheck>
        <disabled>no</disabled>
        <frequency>43200</frequency>
        <scan_on_start>yes</scan_on_start>
        <alert_new_files>yes</alert_new_files>
        <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>
        <directories>/etc,/usr/bin,/usr/sbin</directories>
        <directories>/bin,/sbin,/boot</directories>
        <ignore>/etc/mtab</ignore>
        <ignore>/etc/hosts.deny</ignore>
        <ignore>/etc/adjtime</ignore>
        <ignore type="sregex">.log$|.swp$</ignore>
        <nodiff>/etc/ssl/private.key</nodiff>
        <skip_nfs>yes</skip_nfs>
        <skip_dev>yes</skip_dev>
        <skip_proc>yes</skip_proc>
        <skip_sys>yes</skip_sys>
        <process_priority>10</process_priority>
        <max_eps>100</max_eps>
        <synchronization>
          <enabled>yes</enabled>
          <interval>5m</interval>
          <max_interval>1h</max_interval>
          <max_eps>10</max_eps>
        </synchronization>
      </syscheck>

      <global>
        <!-- Only loopback is exempt from auto-ban; internal (LAN/k8s/mesh)
             source IPs ARE subject to firewall-drop so lateral movement and a
             compromised internal host brute-forcing an agent get banned too.
             Trade-off: repeated failed SSH from an internal IP (e.g. a mistyped
             password) will ban that IP on the attacked host for the AR timeout. -->
        <white_list>127.0.0.1</white_list>
        <white_list>^localhost.localdomain$</white_list>
      </global>

      <command>
        <name>disable-account</name>
        <executable>disable-account</executable>
        <timeout_allowed>yes</timeout_allowed>
      </command>
      <command>
        <name>restart-wazuh</name>
        <executable>restart-wazuh</executable>
      </command>
      <command>
        <name>firewall-drop</name>
        <executable>firewall-drop</executable>
        <timeout_allowed>yes</timeout_allowed>
      </command>
      <!-- FreeBSD equivalent of firewall-drop (which is iptables-only): a
           custom pf-based AR deployed to FreeBSD agents via IaC. Agents without
           the custom-pf-drop script (Linux) just log "command not present". -->
      <command>
        <name>pf-drop</name>
        <executable>custom-pf-drop</executable>
        <timeout_allowed>yes</timeout_allowed>
      </command>
      <!-- YARA malware scan on FIM events. yara.sh + the yara binary are
           deployed to agents via IaC (roles/wazuh_yara); agents without it just
           log "command not present". Fire-once scan, so no timeout. -->
      <command>
        <name>yara</name>
        <executable>yara.sh</executable>
        <timeout_allowed>no</timeout_allowed>
      </command>

      <localfile>
        <log_format>command</log_format>
        <command>df -P</command>
        <frequency>360</frequency>
      </localfile>
      <localfile>
        <log_format>full_command</log_format>
        <command>last -n 20</command>
        <frequency>360</frequency>
      </localfile>

      <!-- Active Response: auto-ban attacking IPs on the agent that is being
           attacked (firewall-drop = iptables on Linux) for 30 min. Triggers on
           brute-force auth failures (SSH, etc.). Internal ranges are whitelisted
           above, so only external/untrusted IPs are ever dropped. firewall-drop
           enforces on Linux agents; non-Linux agents log but do not enforce. -->
      <active-response>
        <command>firewall-drop</command>
        <location>local</location>
        <rules_group>authentication_failures,</rules_group>
        <timeout>1800</timeout>
      </active-response>
      <!-- Same trigger, pf backend, for FreeBSD agents. Linux agents lack the
           custom-pf-drop script and skip it; FreeBSD agents enforce via pf. -->
      <active-response>
        <command>pf-drop</command>
        <location>local</location>
        <rules_group>authentication_failures,</rules_group>
        <timeout>1800</timeout>
      </active-response>
      <!-- YARA-scan every FIM add/modify (broadened to /tmp, /var/tmp, /home in
           the shared agent.conf). yara.sh scans the changed file on the agent and
           quarantines matches. Runs where the yara.sh script exists (IaC role). -->
      <active-response>
        <command>yara</command>
        <location>local</location>
        <rules_group>syscheck,</rules_group>
      </active-response>
      <!-- Escalating response: on a narrow privilege-escalation trigger (rule
           100680), temporarily disable the targeted account on the affected
           agent. TIMEOUT (10 min) auto-re-enables so a mistaken disable heals
           itself; internal source IPs are whitelisted above and never fire AR.
           disable-account enforces on Linux agents. -->
      <active-response>
        <command>disable-account</command>
        <location>local</location>
        <rules_id>100680</rules_id>
        <timeout>600</timeout>
      </active-response>

      <ruleset>
        <decoder_dir>ruleset/decoders</decoder_dir>
        <rule_dir>ruleset/rules</rule_dir>
        <rule_exclude>0215-policy_rules.xml</rule_exclude>
        <list>etc/lists/audit-keys</list>
        <list>etc/lists/amazon/aws-eventnames</list>
        <list>etc/lists/security-eventchannel</list>
        <!-- Threat-intel CDB lists. These ship in the image but were never
             declared, so the stock rules 99901-99920 that reference them via
             match_key ("could not be loaded") were dormant. Declaring them
             compiles the .cdb (ossec-makelists on start) and activates those
             rules; the threat-intel-refresh CronJob keeps malicious-ip current. -->
        <list>etc/lists/malicious-ioc/malicious-ip</list>
        <list>etc/lists/malicious-ioc/malware-hashes</list>
        <list>etc/lists/malicious-ioc/malicious-domains</list>
        <decoder_dir>etc/decoders</decoder_dir>
        <rule_dir>etc/rules</rule_dir>
      </ruleset>

      <rule_test>
        <enabled>yes</enabled>
        <threads>1</threads>
        <max_sessions>64</max_sessions>
        <session_timeout>15m</session_timeout>
      </rule_test>

      <auth>
        <disabled>no</disabled>
        <port>1515</port>
        <use_source_ip>no</use_source_ip>
        <purge>yes</purge>
        <use_password>no</use_password>
        <!-- Replace an existing same-name agent on re-enrollment. Required for
             ephemeral/containerized agents (e.g. the Falco DaemonSet) that
             re-enroll on every pod restart; without it the manager rejects them
             with "Duplicate agent name" and they stay Disconnected. -->
        <force>
          <enabled>yes</enabled>
          <key_mismatch>yes</key_mismatch>
          <!-- Disable the disconnected-time gate: ephemeral DaemonSet agents must
               be replaced immediately on re-enrollment (a rolled pod's old
               registration may still look "connected"). after_registration_time=0
               allows replacing a registration of any age. -->
          <disconnected_time enabled="no">1h</disconnected_time>
          <after_registration_time>0</after_registration_time>
        </force>
        <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>
        <ssl_verify_host>no</ssl_verify_host>
        <ssl_manager_cert>etc/sslmanager.cert</ssl_manager_cert>
        <ssl_manager_key>etc/sslmanager.key</ssl_manager_key>
        <ssl_auto_negotiate>no</ssl_auto_negotiate>
      </auth>

      <cluster>
        <name>wazuh</name>
        <node_name>node01</node_name>
        <node_type>master</node_type>
        <key>aa093264ef885029653eea20dfcf51ae</key>
        <port>1516</port>
        <bind_addr>0.0.0.0</bind_addr>
        <nodes>
          <node>wazuh.manager</node>
        </nodes>
        <hidden>no</hidden>
        <disabled>yes</disabled>
      </cluster>
    </ossec_config>

    <ossec_config>
      <localfile>
        <log_format>syslog</log_format>
        <location>/var/ossec/logs/active-responses.log</location>
      </localfile>

      <!-- Discord alerting for high-severity alerts (level >= 12, which
           includes the falco_high group). The webhook URL is read from the
           DISCORD_WEBHOOK_URL env var (Vault secret/cluster/wazuh-secrets),
           NOT from git; the hook_url below is an ignored placeholder. -->
      <integration>
        <name>custom-discord</name>
        <hook_url>https://localhost/managed-via-env</hook_url>
        <level>12</level>
        <alert_format>json</alert_format>
      </integration>
      <!-- Also notify on brute-force attacks and Active-Response bans, which sit
           below the level-12 threshold above: authentication_failures (brute
           force, L10) and active_response (rule 651 "Host Blocked", L3). Sent
           regardless of level so you see attacks + bans without lowering the
           global threshold (which would flood Discord with all L10+ alerts). -->
      <integration>
        <name>custom-discord</name>
        <hook_url>https://localhost/managed-via-env</hook_url>
        <group>authentication_failures,active_response</group>
        <alert_format>json</alert_format>
      </integration>
      <!-- VirusTotal: on FIM (syscheck) file changes, hash-lookup against VT.
           API key comes from the VIRUSTOTAL_API_KEY env var (Vault secret
           cluster/wazuh-secrets); the api_key below is an ignored placeholder,
           injected by the custom-virustotal wrapper. -->
      <integration>
        <name>custom-virustotal</name>
        <api_key>managed-via-env</api_key>
        <!-- Only NEW files of interest (rule 100690), NOT every syscheck event,
             so the broad FIM scan doesn't blow the VT rate limit. Local YARA +
             malware-hashes CDB still cover all FIM events for free. -->
        <group>virustotal_candidate</group>
        <alert_format>json</alert_format>
      </integration>
    </ossec_config>

  filebeat.yml: |
    filebeat.modules:
      - module: wazuh
        alerts:
          enabled: true
        archives:
          enabled: true
    setup.template.json.enabled: true
    setup.template.overwrite: true
    setup.template.json.path: '/etc/filebeat/wazuh-template.json'
    setup.template.json.name: 'wazuh'
    setup.ilm.enabled: false
    output.elasticsearch:
      hosts: ['https://wazuh-indexer:9200']
      username: 'admin'
      password: '${INDEXER_PASSWORD}'
      ssl.verification_mode: 'certificate'
      ssl.certificate_authorities: ['/etc/ssl/root-ca.pem']
      ssl.certificate: '/etc/ssl/filebeat.pem'
      ssl.key: '/etc/ssl/filebeat-key.pem'
    logging.metrics.enabled: false
    seccomp:
      default_action: allow
      syscalls:
      - action: allow
        names:
        - rseq

  # Custom manager rules, git-managed. The seed-rules initContainer copies this
  # onto the wazuh-etc PVC at /var/ossec/etc/rules/local_rules.xml on each start.
  local_rules.xml: |
    <!-- Managed in git (ArgoCD). Do not hand-edit on the manager PVC. -->
    <group name="falco,">
      <!-- Falco runtime-security events shipped by agents tailing
           /var/log/falco/events.json. Maps Falco priority -> Wazuh level. -->
      <rule id="100600" level="0">
        <decoded_as>json</decoded_as>
        <field name="rule" type="pcre2">.+</field>
        <field name="priority" type="pcre2">.+</field>
        <description>Falco event (base)</description>
        <options>no_full_log</options>
      </rule>
      <rule id="100601" level="3">
        <if_sid>100600</if_sid>
        <field name="priority" type="pcre2">^(Informational|Debug|Notice)$</field>
        <description>Falco $(priority): $(rule)</description>
        <group>falco_low,</group>
      </rule>
      <rule id="100602" level="7">
        <if_sid>100600</if_sid>
        <field name="priority" type="pcre2">^Warning$</field>
        <description>Falco Warning: $(rule)</description>
        <group>falco_medium,</group>
      </rule>
      <rule id="100603" level="12">
        <if_sid>100600</if_sid>
        <field name="priority" type="pcre2">^(Error|Critical|Alert|Emergency)$</field>
        <description>Falco $(priority): $(rule)</description>
        <group>falco_high,</group>
      </rule>
      <!-- Tune-down for a known Falco false positive. "Drop and execute new
           binary in container" (Critical) fires on any benign binary that lives
           on the container's writable overlay layer (exe_flags
           EXE_WRITABLE|EXE_UPPER_LAYER), e.g. coreutils running `readlink`. It
           carries no k8s attribution on Talos (container plugin can't reach the
           runtime socket), so it can't be scoped by namespace and floods Discord
           via the level-12 integration. Drop it below the level-12 Discord
           threshold so it stays visible in the dashboard but stops paging.
           Genuine Falco criticals still match 100603 and still page Discord. -->
      <rule id="100610" level="5">
        <if_sid>100603</if_sid>
        <field name="rule" type="pcre2">^Drop and execute new binary in container$</field>
        <description>Falco (tuned-down, overlay FP): $(rule)</description>
        <group>falco_low,</group>
      </rule>
      <!-- Whitelist the Atlas network scanner's own activity. Its hourly/4h
           ARP+nmap sweeps trip Falco packet-socket/recon rules on the node the
           pod runs on. Keyed on the process SIGNATURE (nmap writing to Atlas's
           /config/logs/nmap_* greppable output), NOT source IP: the pod is
           hostNetwork so its IP moves with rescheduling. Level 1 = below the
           alert threshold, fully suppressed. A real attacker running bare nmap
           does not match the Atlas output path and still alerts. -->
      <rule id="100611" level="1">
        <if_sid>100601</if_sid>
        <field name="output_fields.proc.name" type="pcre2">^nmap$</field>
        <field name="output_fields.proc.cmdline" type="pcre2">/config/logs/nmap_</field>
        <description>Falco (suppressed, Atlas scanner): $(rule)</description>
        <group>falco_low,atlas_whitelist,</group>
      </rule>
    </group>

    <group name="privilege_escalation,">
      <!-- Narrow, high-confidence trigger for the disable-account response:
           repeated sudo/su authentication failures by the SAME user = a
           targeted privilege-escalation attempt. Wired to disable-account with a
           timeout (auto-re-enable) so a mistaken disable self-heals, and the
           <global><white_list> internal ranges never trigger AR. -->
      <rule id="100680" level="10" frequency="6" timeframe="120">
        <if_matched_sid>5503</if_matched_sid>
        <match>sudo</match>
        <same_user />
        <description>Privilege escalation: 6+ sudo auth failures for the same user</description>
        <group>pci_dss_10.2.4,pci_dss_10.2.5,gdpr_IV_35.7.d,</group>
      </rule>
    </group>

    <group name="virustotal_candidate,">
      <!-- Gate VirusTotal to NEW files of interest only (executables, scripts,
           archives, office docs). The broad FIM scan still covers EVERYTHING for
           the local YARA AR + the malware-hashes CDB (both free); this just keeps
           the rate-limited VT cloud API from firing on every /tmp,/home file
           touch. The custom-virustotal integration is bound to this group instead
           of raw syscheck. Child of 554 (file added), so modifies/deletes and
           benign types never reach VT. -->
      <rule id="100690" level="3">
        <if_sid>554</if_sid>
        <field name="file" type="pcre2">(?i)\.(exe|dll|sys|scr|com|pif|bat|cmd|ps1|psm1|vbs|vbe|js|jse|wsf|wsh|hta|jar|py|pl|rb|sh|bash|elf|bin|so|zip|rar|7z|tar|t?gz|bz2|xz|cab|iso|img|vhd|apk|ipa|msi|msix|deb|rpm|pkg|dmg|doc|docx|docm|dotm|xls|xlsx|xlsm|xlsb|ppt|pptx|pptm|rtf|pdf|lnk|chm|reg|swf)$</field>
        <description>FIM: new file of interest added -- VirusTotal candidate: $(file)</description>
        <group>virustotal_candidate,</group>
      </rule>
    </group>

    <group name="openbao,vault,">
      <!-- OpenBao/Vault file audit device (JSON), tailed on vault.starnix.net
           (openbao agent group). No native ruleset ships for Vault, so these
           are first-party. Fields are the flattened audit JSON (request.path,
           request.operation, type, auth.policies, error). -->
      <rule id="100650" level="0">
        <decoded_as>json</decoded_as>
        <field name="request.path" type="pcre2">.+</field>
        <field name="type" type="pcre2">^(request|response)$</field>
        <description>OpenBao audit event (base)</description>
        <options>no_full_log</options>
      </rule>
      <!-- Denied request: an audit response carrying an error (permission
           denied, missing capability, etc.). -->
      <rule id="100651" level="7">
        <if_sid>100650</if_sid>
        <field name="type">^response$</field>
        <field name="error" type="pcre2">.+</field>
        <description>OpenBao: request DENIED on $(request.path) -- $(error)</description>
        <group>gdpr_IV_35.7.d,pci_dss_10.2.4,</group>
      </rule>
      <!-- ROOT-policy token used: the root token should almost never appear. -->
      <rule id="100652" level="12">
        <if_sid>100650</if_sid>
        <field name="auth.policies" type="pcre2">\broot\b</field>
        <description>OpenBao: ROOT-policy token used on $(request.path)</description>
        <group>gdpr_IV_35.7.d,pci_dss_10.2.5,</group>
      </rule>
      <!-- Security-config changes: policies, auth methods, mounts, audit devices. -->
      <rule id="100653" level="10">
        <if_sid>100650</if_sid>
        <field name="request.operation" type="pcre2">^(create|update|delete)$</field>
        <field name="request.path" type="pcre2">^sys/(policies|policy|auth|mounts|audit)/</field>
        <description>OpenBao: config change -- $(request.operation) $(request.path)</description>
        <group>pci_dss_10.2.5,pci_dss_10.2.7,</group>
      </rule>
      <!-- Critical lifecycle ops: seal/unseal/step-down/rekey/generate-root. -->
      <rule id="100654" level="12">
        <if_sid>100650</if_sid>
        <field name="request.path" type="pcre2">^sys/(seal|unseal|step-down|rekey|generate-root|rotate)</field>
        <description>OpenBao: critical operation -- $(request.path)</description>
        <group>pci_dss_10.2.7,</group>
      </rule>
      <!-- Token creation (audit trail of new credentials). -->
      <rule id="100655" level="5">
        <if_sid>100650</if_sid>
        <field name="type">^response$</field>
        <field name="request.path" type="pcre2">^auth/token/create</field>
        <description>OpenBao: token created via $(request.path)</description>
      </rule>
    </group>

    <group name="traefik,web,">
      <!-- Traefik JSON access log, shipped from the cluster via Fluent Bit
           syslog (appname 'k8sjson', JSON-decoded by the local_decoder). NB:
           ClientHost is often the internal tunnel/pod IP, so path/status
           patterns are the reliable signal, not the source IP. -->
      <rule id="100700" level="0">
        <decoded_as>k8sjson</decoded_as>
        <field name="DownstreamStatus" type="pcre2">^\d{3}$</field>
        <field name="RequestPath" type="pcre2">.</field>
        <description>Traefik access (base)</description>
        <options>no_full_log</options>
      </rule>
      <rule id="100701" level="3">
        <if_sid>100700</if_sid>
        <field name="DownstreamStatus" type="pcre2">^4\d\d$</field>
        <description>Traefik 4xx: $(RequestMethod) $(RequestPath) -> $(DownstreamStatus)</description>
        <group>pci_dss_6.5,</group>
      </rule>
      <!-- A single 401/403 is normal web behaviour (SPA "am I logged in?"
           checks like overseerr GET /api/v1/auth/me, ipAllowList denials, any
           protected resource hit without a session); these are not auth
           failures. This rule is informational only (NOT in
           authentication_failures, so it does not invoke firewall-drop).
           firewall-drop can't act on Traefik logs anyway: they carry
           ClientHost/ClientAddr, not the srcip field the AR reads ("Cannot
           read srcip from data"), and it runs location:local on the manager,
           not on the ingress path. Real brute force is caught by the frequency
           rule 100706 below. (NB: no double-hyphen allowed in XML comments.) -->
      <rule id="100702" level="5">
        <if_sid>100700</if_sid>
        <field name="DownstreamStatus" type="pcre2">^40[13]$</field>
        <field name="RequestPath" negate="yes" type="pcre2">(?i)(/auth/me$|/api/v\d+/(auth/me|status|session)$)</field>
        <description>Traefik 401/403: $(RequestMethod) $(RequestPath)</description>
        <group>web,pci_dss_10.2.4,</group>
      </rule>
      <rule id="100706" level="10" frequency="8" timeframe="120">
        <if_matched_sid>100702</if_matched_sid>
        <same_field>ClientHost</same_field>
        <description>Traefik: repeated 401/403 from $(ClientHost) -- possible web brute-force</description>
        <group>web,attack,pci_dss_10.2.4,</group>
      </rule>
      <rule id="100703" level="5">
        <if_sid>100700</if_sid>
        <field name="DownstreamStatus" type="pcre2">^5\d\d$</field>
        <description>Traefik 5xx: $(RequestMethod) $(RequestPath) -> $(DownstreamStatus)</description>
      </rule>
      <rule id="100704" level="10">
        <if_sid>100700</if_sid>
        <field name="RequestPath" type="pcre2">(?i)(\.\./|/etc/passwd|/\.env|/\.git|wp-login|wp-admin|/actuator|/phpmyadmin|/vendor/|/boaform|/cgi-bin/|union\s+select|&lt;script)</field>
        <description>Traefik: suspicious request path -- $(RequestPath)</description>
        <group>web_scan,attack,pci_dss_6.5,</group>
      </rule>
      <rule id="100705" level="10" frequency="15" timeframe="60">
        <if_matched_sid>100701</if_matched_sid>
        <same_field>ClientHost</same_field>
        <description>Traefik: possible web scan -- 15+ 4xx from $(ClientHost) in 60s</description>
        <group>web_scan,attack,</group>
      </rule>
    </group>

    <group name="authentik,">
      <!-- Authentik structured JSON (logger authentik.*), same Fluent Bit path.
           Request logs carry level/event/remote/status/user. Note: the richest
           auth events live in Authentik's Events model; stdout covers request +
           warning/error + the failure strings matched below. -->
      <rule id="100720" level="0">
        <decoded_as>k8sjson</decoded_as>
        <field name="logger" type="pcre2">^authentik\.</field>
        <description>Authentik event (base)</description>
        <options>no_full_log</options>
      </rule>
      <rule id="100721" level="6">
        <if_sid>100720</if_sid>
        <field name="level">^warning$</field>
        <description>Authentik warning: $(event) ($(logger))</description>
      </rule>
      <rule id="100722" level="10">
        <if_sid>100720</if_sid>
        <field name="level" type="pcre2">^(error|critical)$</field>
        <description>Authentik error: $(event) ($(logger))</description>
      </rule>
      <!-- Match GENUINE auth failures only. Authentik's HTTP access logs
           (logger authentik.asgi) put the request URL in the `event` field, so
           the admin dashboard polling
           /api/v3/events/events/volume/?actions=...&amp;actions=login_failed
           made this rule fire on every page refresh (a status-200 GET); and
           because it sits in authentication_failures it paged Discord and
           tripped the firewall-drop Active Response (a no-op, since `remote` is
           never mapped to srcip, but still noisy). Genuine failures come from
           the events/stage loggers, never authentik.asgi, and their `event` is
           a phrase, not a URL. So exclude authentik.asgi and any URL-shaped
           event (leading slash). -->
      <rule id="100723" level="7">
        <if_sid>100720</if_sid>
        <field name="logger" type="pcre2">^authentik\.(?!asgi(?:\.|$))</field>
        <field name="event" type="pcre2">(?i)^(?!/)(?=.*(?:invalid.credential|failed.login|authentication.failed|permission.denied|invalid.password|login.failed))</field>
        <description>Authentik: auth failure -- $(event) (user=$(user) remote=$(remote))</description>
        <group>authentication_failures,pci_dss_10.2.4,gdpr_IV_35.7.d,</group>
      </rule>
      <rule id="100724" level="10" frequency="8" timeframe="120">
        <if_matched_sid>100723</if_matched_sid>
        <same_field>remote</same_field>
        <description>Authentik: possible brute force -- 8+ auth failures from $(remote) in 120s</description>
        <group>authentication_failures,attack,</group>
      </rule>
    </group>

    <!-- Auditd keys deployed on Arch hosts by the Ansible arch role
         (/etc/audit/rules.d/supplychain.rules), shipped via the arch group's
         audit localfile. Give the supply-chain keys real severity; without
         these they land as generic level-3 audit events. exec_shm (execution
         from /dev/shm) is the only page-worthy one; /tmp exec and persistence
         writes happen during legit AUR builds / systemctl enable, so log-only
         at level 8 and tune up if a host proves quiet. -->
    <group name="audit,audit_key,">
      <rule id="100730" level="0">
        <if_group>audit</if_group>
        <field name="audit.key">\.+</field>
        <description>Auditd event carrying a rule key (base)</description>
      </rule>
      <rule id="100731" level="12">
        <if_sid>100730</if_sid>
        <field name="audit.key">^exec_shm$</field>
        <description>Auditd: execution from /dev/shm -- $(audit.exe) (auid=$(audit.auid))</description>
        <group>exec_from_staging,gdpr_IV_35.7.d,</group>
      </rule>
      <rule id="100732" level="8">
        <if_sid>100730</if_sid>
        <field name="audit.key">^exec_tmp$</field>
        <description>Auditd: execution from /tmp -- $(audit.exe) (auid=$(audit.auid))</description>
        <group>exec_from_staging,</group>
      </rule>
      <rule id="100733" level="8">
        <if_sid>100730</if_sid>
        <field name="audit.key" type="pcre2">^persist_(systemd|user_systemd)$</field>
        <description>Auditd: systemd unit path written ($(audit.key)) -- $(audit.exe)</description>
        <group>persistence,</group>
      </rule>
      <rule id="100734" level="8">
        <if_sid>100730</if_sid>
        <field name="audit.key">^persist_shellrc$</field>
        <description>Auditd: shell rc file modified -- $(audit.exe) (auid=$(audit.auid))</description>
        <group>persistence,</group>
      </rule>
      <rule id="100735" level="8">
        <if_sid>100730</if_sid>
        <field name="audit.key">^persist_cron$</field>
        <description>Auditd: cron path modified -- $(audit.exe) (auid=$(audit.auid))</description>
        <group>persistence,</group>
      </rule>
    </group>

    <!-- pacman.log is collected (arch group localfile) but arrives
         unstructured; decode it (local_decoder pacman) and alert on package
         changes. Removal of security tooling is the high-signal case. -->
    <group name="pacman,software_management,">
      <rule id="100740" level="3">
        <decoded_as>pacman</decoded_as>
        <description>pacman: $(pkgaction) $(pkg) ($(version))</description>
      </rule>
      <rule id="100741" level="5">
        <if_sid>100740</if_sid>
        <field name="pkgaction" type="pcre2">^(installed|removed|downgraded)$</field>
        <description>pacman: package $(pkgaction) -- $(pkg) ($(version))</description>
      </rule>
      <rule id="100742" level="10">
        <if_sid>100740</if_sid>
        <field name="pkgaction">^removed$</field>
        <field name="pkg" type="pcre2">^(audit|auditd|wazuh-agent|falco|opensnitch|nftables|iptables|ufw|firewalld|apparmor|sudo|openssh)$</field>
        <description>pacman: SECURITY package REMOVED -- $(pkg) ($(version))</description>
        <group>config_changed,</group>
      </rule>
    </group>

    <!-- OpenSnitch application-firewall events (selene). The opensnitch-wazuh
         bridge (Ansible role opensnitch_wazuh) tails OpenSnitch's JSON SIEM
         stream, drops process_env, and forwards only denies + first-seen
         (process,dst) pairs to /var/log/opensnitch/events.json, read by a
         host-local json localfile. Wazuh's json decoder flattens to
         Event.* / Action / bridge_reason. -->
    <group name="opensnitch,firewall,">
      <rule id="100750" level="0">
        <decoded_as>json</decoded_as>
        <field name="bridge_reason">\.+</field>
        <description>OpenSnitch event (base)</description>
      </rule>
      <rule id="100751" level="3">
        <if_sid>100750</if_sid>
        <field name="bridge_reason">^first_seen$</field>
        <description>OpenSnitch: new egress $(Event.process_path) -> $(Event.dst_host):$(Event.dst_port) ($(Action))</description>
      </rule>
      <!-- Key on bridge_reason, not Action: 'action' is a reserved Wazuh
           static field and <field name="Action"> fails to compile. The bridge
           sets bridge_reason=deny exactly when Action is a block. -->
      <rule id="100752" level="6">
        <if_sid>100750</if_sid>
        <field name="bridge_reason">^deny$</field>
        <description>OpenSnitch DENY: $(Event.process_path) -> $(Event.dst_host):$(Event.dst_port)</description>
      </rule>
    </group>

  # Custom decoders (git-managed), seeded to /var/ossec/etc/decoders by the
  # seed-rules initContainer (etc/decoders is already in <ruleset>).
  local_decoder.xml: |
    <!-- k8s app logs arrive via the Fluent Bit syslog output with appname
         'k8sjson'; JSON-decode the message so Traefik/Authentik fields land in
         data.* for rules 100700+/100720+. -->
    <decoder name="k8sjson">
      <program_name>^k8sjson$</program_name>
      <plugin_decoder>JSON_Decoder</plugin_decoder>
    </decoder>
    <!-- pacman.log (arch group localfile) arrives unstructured. Lines look like:
           [2026-08-27T10:15:30-0700] [ALPM] installed foo (1.2.3-1)
           [2026-08-27T10:15:31-0700] [ALPM] upgraded bar (1.0-1 -> 1.1-1)
         Extract action/package/version for rules 100740+. -->
    <decoder name="pacman">
      <prematch type="pcre2">\[ALPM\] (?:installed|removed|upgraded|downgraded|reinstalled) </prematch>
      <regex type="pcre2">\[ALPM\] (\w+) (\S+) \((.+)\)</regex>
      <!-- NB: 'action' is a reserved Wazuh static field (not rule-matchable via
           <field>), so the operation is named 'pkgaction' to stay dynamic. -->
      <order>pkgaction, pkg, version</order>
    </decoder>

  # Wazuh -> Discord integration scripts, seeded onto the integrations PVC by
  # the seed-integrations initContainer. Webhook URL comes from the env var
  # DISCORD_WEBHOOK_URL (Vault secret/cluster/wazuh-secrets).
  custom-discord: |
    #!/bin/sh
    # Wazuh runs this wrapper; delegate to the poster using Wazuh's bundled
    # python (fallback: system python3). $1=alert file, $2=api key, $3=hook url.
    DIR=$(dirname "$0")
    WPY=/var/ossec/framework/python/bin/python3
    if [ -x "$WPY" ]; then exec "$WPY" "$DIR/custom-discord.py" "$@"; fi
    exec python3 "$DIR/custom-discord.py" "$@"
  custom-discord.py: |
    #!/usr/bin/env python3
    """Wazuh -> Discord: post a severity-colored embed per routed alert.
    Webhook URL from $DISCORD_WEBHOOK_URL (Vault), else argv[3]."""
    import json
    import os
    import sys

    import requests


    def main():
        if len(sys.argv) < 2:
            return 0
        hook = os.environ.get("DISCORD_WEBHOOK_URL") or (
            sys.argv[3] if len(sys.argv) > 3 else "")
        if not hook or "managed-via-env" in hook:
            sys.stderr.write("custom-discord: no DISCORD_WEBHOOK_URL set\n")
            return 0
        try:
            with open(sys.argv[1]) as fh:
                alert = json.load(fh)
        except Exception as exc:
            sys.stderr.write("custom-discord: cannot read alert: %s\n" % exc)
            return 0
        rule = alert.get("rule", {})
        level = int(rule.get("level", 0) or 0)
        color = 0xE01E5A if level >= 12 else 0xECB22E if level >= 7 else 0x2EB67D
        agent = alert.get("agent", {}).get("name", "?")
        groups = (", ".join(rule.get("groups", [])) or "-")[:1024]
        fields = [
            {"name": "Agent", "value": str(agent)[:256], "inline": True},
            {"name": "Rule", "value": str(rule.get("id", "?")), "inline": True},
            {"name": "Level", "value": str(level), "inline": True},
            {"name": "Groups", "value": groups, "inline": False},
        ]
        full_log = alert.get("full_log")
        if full_log:
            fields.append(
                {"name": "Log", "value": str(full_log)[:1000], "inline": False})
        embed = {
            "title": ("[L%d] %s" % (
                level, rule.get("description", "Wazuh alert")))[:256],
            "color": color,
            "fields": fields,
        }
        try:
            # requests carries its own certifi CA bundle, so TLS verification
            # works in the manager pod (the bundled python's urllib could not
            # find a CA bundle). The custom User-Agent avoids Discord's WAF 403.
            requests.post(
                hook,
                json={"username": "Wazuh", "embeds": [embed]},
                headers={"User-Agent": "Wazuh-Discord-Integration/1.0"},
                timeout=10,
            ).raise_for_status()
        except Exception as exc:
            sys.stderr.write("custom-discord: post failed: %s\n" % exc)
        return 0


    if __name__ == "__main__":
        sys.exit(main())
  # Wrapper that injects the VT API key from $VIRUSTOTAL_API_KEY (Vault-synced)
  # and delegates to the image's bundled virustotal.py. Keeps the key out of git.
  # Wazuh calls: $1=alert file, $2=api key (placeholder, replaced), $3=hook url.
  custom-virustotal: |
    #!/bin/sh
    DIR=$(dirname "$0")
    WPY=/var/ossec/framework/python/bin/python3
    [ -x "$WPY" ] || WPY=python3
    exec "$WPY" "$DIR/virustotal.py" "$1" "${VIRUSTOTAL_API_KEY}" "$3" "$4" "$5"

---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager
  namespace: wazuh
spec:
  selector:
    app: wazuh-manager
  ports:
  - name: api
    port: 55000
    targetPort: 55000
  # In-cluster agents (e.g. the Falco DaemonSet) must reach 1514/1515 via this
  # ClusterIP, NOT wazuh-manager-lb: that LoadBalancer is externalTrafficPolicy:
  # Local, so pod->VIP only routes on the node running the manager pod. A
  # ClusterIP routes from any node.
  - name: agents
    port: 1514
    targetPort: 1514
  - name: enrollment
    port: 1515
    targetPort: 1515

---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager-lb
  namespace: wazuh
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.7.220
    external-dns.alpha.kubernetes.io/hostname: wazuh.starnix.net
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: wazuh-manager
  ports:
  - name: agent
    port: 1514
    targetPort: 1514
    protocol: TCP
  - name: enrollment
    port: 1515
    targetPort: 1515
    protocol: TCP
  - name: syslog
    port: 514
    targetPort: 514
    protocol: UDP
  - name: api
    port: 55000
    targetPort: 55000
    protocol: TCP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager
  namespace: wazuh
  annotations:
    # Roll the manager when its ConfigMap (rules / integration scripts /
    # ossec.conf) or Secrets change -- otherwise a ConfigMap-only change does
    # not re-run the seed initContainers. Matches homepage/ouija-board.
    reloader.stakater.com/auto: "true"
spec:
  serviceName: wazuh-manager
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-manager
  template:
    metadata:
      labels:
        app: wazuh-manager
    spec:
      # Map wazuh.indexer (the indexer node cert's SAN) to the indexer Service
      # ClusterIP so the modulesd indexer connector passes TLS hostname
      # verification. The Service clusterIP is pinned in wazuh-indexer.yaml.
      hostAliases:
      - ip: "10.98.203.221"
        hostnames:
        - "wazuh.indexer"
      initContainers:
      # The queue is now a Longhorn PVC (was emptyDir). A fresh block volume
      # mounts root:root, but wazuh-db (uid 101) must create queue/db + the wdb
      # socket, so make it wazuh-owned before the daemons start.
      - name: chown-queue
        image: busybox
        command:
        - sh
        - -c
        - |
          # A fresh ext4 (Longhorn) volume ships a lost+found that fools the
          # manager entrypoint's "populate queue if empty" check, so it never
          # creates queue/db and wazuh-db can't bind queue/db/wdb. Wipe an
          # UNINITIALIZED queue (no global.db) to truly-empty so it repopulates;
          # NEVER wipe an initialized one -- that persistence is the whole point.
          if [ ! -e /var/ossec/queue/db/global.db ]; then
            rm -rf /var/ossec/queue/* /var/ossec/queue/.[!.]* 2>/dev/null || true
          fi
          chown -R 101:101 /var/ossec/queue 2>/dev/null || true
          chmod 770 /var/ossec/queue
        volumeMounts:
        - name: wazuh-queue
          mountPath: /var/ossec/queue
      - name: seed-agent-groups
        image: busybox
        command:
        - sh
        - -c
        - |
          for group in arch debian falco freebsd kubernetes-node macos openbao; do
            mkdir -p /var/ossec/etc/shared/$group
            cp /agent-groups/$group.conf /var/ossec/etc/shared/$group/agent.conf
            chown 101:101 /var/ossec/etc/shared/$group/agent.conf
            chmod 660 /var/ossec/etc/shared/$group/agent.conf
            # The group DIR must be wazuh-writable too: wazuh-remoted (uid/gid
            # 101) generates merged.mg inside it to push shared config to agents.
            # mkdir leaves it root:wazuh 0755 (no group write) -> "Permission
            # denied" building merged.mg -> agents never get the shared config.
            chown 101:101 /var/ossec/etc/shared/$group
            chmod 770 /var/ossec/etc/shared/$group
          done
        volumeMounts:
        - name: wazuh-etc
          mountPath: /var/ossec/etc
        - name: agent-groups
          mountPath: /agent-groups
          readOnly: true
      # Seed git-managed custom rules onto the PVC (mirrors seed-agent-groups).
      - name: seed-rules
        image: busybox
        command:
        - sh
        - -c
        - |
          mkdir -p /var/ossec/etc/rules /var/ossec/etc/decoders
          # Own as the wazuh user (999) that the manager daemons run as, NOT
          # 101 (the ossec UID from older Wazuh images). analysisd drops to the
          # wazuh user to read the ruleset; 101:101 0660 is unreadable by 999,
          # so analysisd fails to start ("Could not open ... Permission denied")
          # and the whole manager stays down on restart.
          cp /rules-src/local_rules.xml /var/ossec/etc/rules/local_rules.xml
          chown 999:999 /var/ossec/etc/rules/local_rules.xml
          chmod 640 /var/ossec/etc/rules/local_rules.xml
          cp /rules-src/local_decoder.xml /var/ossec/etc/decoders/local_decoder.xml
          chown 999:999 /var/ossec/etc/decoders/local_decoder.xml
          chmod 640 /var/ossec/etc/decoders/local_decoder.xml
        volumeMounts:
        - name: wazuh-etc
          mountPath: /var/ossec/etc
        - name: wazuh-config
          mountPath: /rules-src
          readOnly: true
      # Seed the git-managed Discord integration onto the integrations PVC.
      - name: seed-integrations
        image: busybox
        command:
        - sh
        - -c
        - |
          for f in custom-discord custom-discord.py custom-virustotal; do
            cp /config-src/$f /var/ossec/integrations/$f
            # root:wazuh 0750 -- integratord (runs as wazuh) refuses to exec a
            # script it can write, so owner must be root, matching the bundled
            # integrations (slack, pagerduty, ...).
            chown 0:101 /var/ossec/integrations/$f
            chmod 750 /var/ossec/integrations/$f
          done
        volumeMounts:
        - name: wazuh-integrations
          mountPath: /var/ossec/integrations
        - name: wazuh-config
          mountPath: /config-src
          readOnly: true
      containers:
      - name: wazuh-manager
        image: wazuh/wazuh-manager:4.14.1
        ports:
        - containerPort: 1514
        - containerPort: 1515
        - containerPort: 514
          protocol: UDP
        - containerPort: 55000
        env:
        - name: INDEXER_URL
          value: "https://wazuh.indexer:9200"
        - name: INDEXER_USERNAME
          value: "admin"
        - name: INDEXER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wazuh-secrets
              key: INDEXER_PASSWORD
        - name: FILEBEAT_SSL_VERIFICATION_MODE
          value: "certificate"
        - name: SSL_CERTIFICATE_AUTHORITIES
          value: /etc/ssl/root-ca.pem
        - name: SSL_CERTIFICATE
          value: /etc/ssl/filebeat.pem
        - name: SSL_KEY
          value: /etc/ssl/filebeat-key.pem
        - name: API_USERNAME
          value: "wazuh-wui"
        - name: API_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wazuh-secrets
              key: API_PASSWORD
        # Webhook URL for the custom-discord integration (Vault-synced secret).
        - name: DISCORD_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: wazuh-secrets
              key: DISCORD_WEBHOOK_URL
              optional: true
        # API key for the custom-virustotal integration (Vault-synced secret).
        - name: VIRUSTOTAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: wazuh-secrets
              key: VIRUSTOTAL_API_KEY
              optional: true
        volumeMounts:
        - name: wazuh-config
          mountPath: /wazuh-config-mount/etc/ossec.conf
          subPath: ossec.conf
        - name: certs
          mountPath: /etc/ssl/root-ca.pem
          subPath: root-ca.pem
        - name: certs
          mountPath: /etc/ssl/filebeat.pem
          subPath: filebeat.pem
        - name: certs
          mountPath: /etc/ssl/filebeat-key.pem
          subPath: filebeat-key.pem
        - name: wazuh-api-configuration
          mountPath: /var/ossec/api/configuration
        - name: wazuh-etc
          mountPath: /var/ossec/etc
        - name: wazuh-logs
          mountPath: /var/ossec/logs
        - name: wazuh-queue
          mountPath: /var/ossec/queue
        - name: wazuh-var-multigroups
          mountPath: /var/ossec/var/multigroups
        - name: wazuh-integrations
          mountPath: /var/ossec/integrations
        - name: wazuh-active-response
          mountPath: /var/ossec/active-response/bin
        - name: wazuh-agentless
          mountPath: /var/ossec/agentless
        - name: wazuh-wodles
          mountPath: /var/ossec/wodles
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
      volumes:
      - name: wazuh-config
        configMap:
          name: wazuh-manager-config
      - name: certs
        secret:
          secretName: wazuh-certs
          items:
          - key: root-ca.pem
            path: root-ca.pem
          - key: filebeat.pem
            path: filebeat.pem
          - key: filebeat-key.pem
            path: filebeat-key.pem
      - name: wazuh-api-configuration
        persistentVolumeClaim:
          claimName: wazuh-manager-api-configuration
      - name: wazuh-etc
        persistentVolumeClaim:
          claimName: wazuh-manager-etc
      - name: wazuh-logs
        persistentVolumeClaim:
          claimName: wazuh-manager-logs
      - name: wazuh-queue
        # Longhorn (block) so global.db (agent group memberships) + the queue
        # sockets persist across manager restarts. NFS cannot hold either.
        persistentVolumeClaim:
          claimName: wazuh-manager-queue
      - name: wazuh-var-multigroups
        emptyDir: {}
      - name: wazuh-integrations
        persistentVolumeClaim:
          claimName: wazuh-manager-integrations
      - name: wazuh-active-response
        persistentVolumeClaim:
          claimName: wazuh-manager-active-response
      - name: wazuh-agentless
        persistentVolumeClaim:
          claimName: wazuh-manager-agentless
      - name: wazuh-wodles
        persistentVolumeClaim:
          claimName: wazuh-manager-wodles
      - name: agent-groups
        configMap:
          name: wazuh-agent-groups
