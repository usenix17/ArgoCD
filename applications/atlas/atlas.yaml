---
# Atlas -- network discovery + visualization (github.com/karam-ajaj/atlas).
# Talos adaptations vs its Docker-first design:
#  - hostNetwork + NET_RAW/NET_ADMIN so ARP/nmap sees the real VLANs, not the
#    pod CIDR (hence the privileged PSA label below, same as falco).
#  - NO Docker socket on Talos: container-inspection features stay empty by
#    design; the network scanning/mapping is what we run it for.
#  - SQLite (/config/db/atlas.db) on Longhorn -> strategy Recreate (RWO rule).
# Admin creds come from OpenBao secret/cluster/atlas-secrets via ESO.
apiVersion: v1
kind: Namespace
metadata:
  name: atlas
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlas-secrets
  namespace: atlas
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: atlas-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/atlas-secrets
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atlas-config
  namespace: atlas
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas
  namespace: atlas
spec:
  replicas: 1
  strategy:
    type: Recreate        # RWO Longhorn PVC + hostNetwork port claim
  selector:
    matchLabels:
      app: atlas
  template:
    metadata:
      labels:
        app: atlas
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: atlas
          image: keinstien/atlas:3.3.4
          env:
            - name: ATLAS_UI_PORT
              value: "8888"
            - name: ATLAS_API_PORT
              value: "8889"
            - name: ATLAS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: atlas-secrets
                  key: ATLAS_ADMIN_USER
            - name: ATLAS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-secrets
                  key: ATLAS_ADMIN_PASSWORD
            # Explicit subnets: auto-detect would only see the node's own VLAN.
            # ARP works on 192.168.7.0/24 (local L2); the others are routed, so
            # they get nmap TCP discovery -- IoT/Restricted left out on purpose.
            - name: SCAN_SUBNETS
              value: "192.168.7.0/24,192.168.1.0/24,192.168.2.0/24"
            - name: FASTSCAN_INTERVAL
              value: "3600"
            - name: DEEPSCAN_INTERVAL
              value: "14400"
            # No Docker socket on Talos; push the pointless scan far out.
            - name: DOCKERSCAN_INTERVAL
              value: "86400"
          ports:
            - { name: ui, containerPort: 8888 }
            - { name: api, containerPort: 8889 }
          securityContext:
            capabilities:
              add: ["NET_RAW", "NET_ADMIN"]
          volumeMounts:
            # ONLY the db dir: the image bakes its entrypoint scripts under
            # /config (scripts/atlas_check.sh), so mounting a PVC over all of
            # /config shadows them -> RunContainerError "no such file".
            - name: config
              mountPath: /config/db
          readinessProbe:
            httpGet: { path: /, port: 8888 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: atlas-config
---
apiVersion: v1
kind: Service
metadata:
  name: atlas
  namespace: atlas
  labels:
    app: atlas
spec:
  selector:
    app: atlas
  ports:
    - { name: ui, port: 8888, targetPort: 8888 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas
  namespace: atlas
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: atlas.starnix.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atlas
                port:
                  number: 8888
  tls:
    - secretName: atlas-tls
      hosts:
        - atlas.starnix.net
