---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare
spec:
  replicas: 3
  selector:
    matchLabels: { app: cloudflared }
  template:
    metadata:
      labels: { app: cloudflared }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: { matchLabels: { app: cloudflared } }
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.2
          # http2 transport: QUIC (UDP 7844) fails ALPN through the cluster's
          # egress NAT/CNI ("tls: no application protocol"); http2 over TCP 443 is reliable.
          args: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--metrics", "0.0.0.0:2000", "--grace-period", "30s", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: { name: cloudflare-secrets, key: TUNNEL_TOKEN }
            - name: HOME
              value: /tmp
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: 2000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      terminationGracePeriodSeconds: 60
      volumes:
        - { name: tmp, emptyDir: {} }
---
# Sync hook: applies ingress.yaml to Cloudflare on every ArgoCD sync.
# Uses CF_API_TOKEN from Vault-managed cloudflare-secrets.
apiVersion: batch/v1
kind: Job
metadata:
  name: apply-tunnel-config
  namespace: cloudflare
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: sync
        image: python:3-alpine
        command:
        - sh
        - -c
        - |
          pip install pyyaml --quiet --no-cache-dir && python3 - <<'PYEOF'
          import yaml, json, urllib.request, urllib.parse, os, sys

          ingress    = yaml.safe_load(open('/config/ingress.yaml'))
          account_id = open('/config/account-id').read().strip()
          tunnel_id  = open('/config/tunnel-id').read().strip()
          token      = os.environ['CF_API_TOKEN']
          dns_token  = os.environ['CF_DNS_TOKEN']
          headers    = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

          def cf(method, path, data=None):
              url = f'https://api.cloudflare.com/client/v4{path}'
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, method=method)
              for k, v in headers.items():
                  req.add_header(k, v)
              try:
                  resp = urllib.request.urlopen(req)
                  return json.load(resp)
              except urllib.error.HTTPError as e:
                  print(f'HTTP {e.code} {method} {path}:', e.read().decode(), file=sys.stderr)
                  sys.exit(1)

          # 1. Push tunnel ingress config
          result = cf('PUT', f'/accounts/{account_id}/cfd_tunnel/{tunnel_id}/configurations',
                      {'config': {'ingress': ingress}})
          if not result['success']:
              print('Tunnel config error:', result['errors'], file=sys.stderr)
              sys.exit(1)
          routes = len([r for r in ingress if 'hostname' in r])
          print(f'Tunnel {tunnel_id} config applied ({routes} routes + catch-all)')

          # 2. Build zone map using DNS token (has Zone:Read + DNS:Edit)
          headers['Authorization'] = f'Bearer {dns_token}'
          zones_result = cf('GET', f'/zones?account.id={account_id}&per_page=100')
          zone_map = {z['name']: z['id'] for z in zones_result['result']}

          def find_zone(hostname):
              parts = hostname.split('.')
              for i in range(len(parts) - 1):
                  candidate = '.'.join(parts[i:])
                  if candidate in zone_map:
                      return candidate, zone_map[candidate]
              return None, None

          # 3. Upsert CNAME for every hostname in the ingress config
          cname_target = f'{tunnel_id}.cfargotunnel.com'
          for route in ingress:
              hostname = route.get('hostname')
              if not hostname:
                  continue
              _, zone_id = find_zone(hostname)
              if not zone_id:
                  print(f'  SKIP {hostname}: no matching zone found')
                  continue

              existing = cf('GET', f'/zones/{zone_id}/dns_records?type=CNAME&name={urllib.parse.quote(hostname)}')
              records  = existing.get('result', [])

              if not records:
                  cf('POST', f'/zones/{zone_id}/dns_records',
                     {'type': 'CNAME', 'name': hostname, 'content': cname_target, 'proxied': True})
                  print(f'  CREATED  {hostname} -> {cname_target}')
              elif records[0]['content'] != cname_target or not records[0]['proxied']:
                  cf('PUT', f'/zones/{zone_id}/dns_records/{records[0]["id"]}',
                     {'type': 'CNAME', 'name': hostname, 'content': cname_target, 'proxied': True})
                  print(f'  UPDATED  {hostname} -> {cname_target}')
              else:
                  print(f'  OK       {hostname}')
          PYEOF
        env:
        - name: CF_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-secrets
              key: CF_API_TOKEN
        - name: CF_DNS_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-secrets
              key: CF_DNS_TOKEN
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        configMap:
          name: tunnel-config
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared
  namespace: cloudflare
spec:
  endpointSelector: { matchLabels: { app: cloudflared } }
  egress:
    - toEndpoints: [{ matchLabels: { "k8s:io.kubernetes.pod.namespace": kube-system, "k8s-app": kube-dns } }]
      toPorts: [{ ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }] }]
    - toEntities: ["world"]
      toPorts:
        - ports: [{ port: "7844", protocol: UDP }, { port: "7844", protocol: TCP }, { port: "443", protocol: TCP }]
    - toEndpoints: [{ matchLabels: { "k8s:io.kubernetes.pod.namespace": traefik } }]
      toPorts: [{ ports: [{ port: "443", protocol: TCP }, { port: "80", protocol: TCP }] }]
    - toEndpoints: [{ matchLabels: { "k8s:io.kubernetes.pod.namespace": jellyfin } }]
      toPorts: [{ ports: [{ port: "8096", protocol: TCP }] }]
    - toCIDR: ["192.168.1.0/24", "192.168.7.0/24", "192.168.8.0/24", "172.16.5.0/24"]
