---
# On-add build trigger. ArgoCD runs this Job as a PostSync hook whenever the
# aur-mirror app syncs -- notably when a package is added to allowlist.yaml --
# so a new package is built within minutes instead of waiting for the hourly
# cron. aur-build-all skips up-to-date packages, so a sync-triggered
# run only builds what changed.
#
# hook-delete-policy BeforeHookCreation: ArgoCD deletes the previous instance
# of this Job before each new sync, so re-runs use the stable name and the last
# run stays visible for debugging.
#
# IMPORTANT: the pod spec below intentionally mirrors the CronJob in
# builder.yaml (YAML anchors cannot span the two documents). Keep them in sync
# -- image, runtimeClassName, env, volumes, resources. Every phase takes the
# run lock (aurmirror/lock.py), so this job and the scheduled cron never write
# the repo db / sign concurrently.
apiVersion: batch/v1
kind: Job
metadata:
  name: aur-builder-onsync
  namespace: aur-mirror
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  # Build time plus headroom to wait on the run lock if a scheduled run is still
  # in progress when an add lands.
  activeDeadlineSeconds: 36000
  template:
    metadata:
      labels:
        app: aur-builder
    spec:
      restartPolicy: OnFailure
      # gVisor kernel per pod; each package builds in its own aur-sandbox.
      runtimeClassName: gvisor
      # The build phase runs untrusted PKGBUILD code; deny it a ServiceAccount
      # token so a malicious build cannot reach the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: repo
          persistentVolumeClaim:
            claimName: aur-mirror-pvc
        - name: allowlist
          configMap:
            name: aur-allowlist
        # Scan-state PV: verdicts.json, written by the scan phase, read by build.
        - name: state
          persistentVolumeClaim:
            claimName: aur-mirror-state-pvc
        - name: gpg-home
          emptyDir: {}
        - name: build-dir
          emptyDir:
            sizeLimit: 50Gi
        - name: lock
          # Coordination volume for the run lock, separate from the repo so
          # the build phase can mount /repo read-only.
          persistentVolumeClaim:
            claimName: aur-mirror-lock-pvc
        # Public status files for the mirror website (live.json, logs,
        # packages.json). Untrusted: served only as JSON or plain text.
        - name: status
          persistentVolumeClaim:
            claimName: aur-mirror-status-pvc
      initContainers:
        # Phase 1: scan. Resolve each package's AUR HEAD and Claude-scan it,
        # writing verdicts to the state PV. ONLY container with ANTHROPIC_API_KEY;
        # never runs makepkg, mounts neither repo nor GPG key. Always exits 0.
        - name: scan
          image: registry.starnix.net/library/aur-builder@sha256:fa35f338811366586ec6f0acba9525c132f8bb5f3bf8997e3dd86849ccf6a8c0
          command:
            # Scan runs under the isolated anthropic venv (see Dockerfile); the
            # build/sign phases use the system python so package install-paths
            # resolve to /usr, not the venv prefix.
            - /opt/scan-venv/bin/python3
            - /usr/local/bin/aur-build-all
          env:
            - name: BUILD_PHASE
              value: scan
            - name: STATUS_DIR
              value: /status
            - name: REPO_DIR
              value: /repo
            - name: STATE_DIR
              value: /state
            - name: ALLOWLIST
              value: /config/allowlist.yaml
            - name: REPO_NAME
              value: aur-mirror
            - name: PUSHGATEWAY_URL
              value: "http://prometheus-pushgateway.monitoring.svc.cluster.local:9091"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aur-api-key
                  key: ANTHROPIC_API_KEY
          volumeMounts:
            - name: allowlist
              mountPath: /config
            - name: state
              mountPath: /state
            - name: lock
              mountPath: /lock
            - name: status
              mountPath: /status
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
        # Phase 2: build. Checks out each package's SCANNED commit, installs deps
        # from the signed repos, runs makepkg (the untrusted PKGBUILD code) in
        # aur-sandbox. No GPG key or API key mounted here, so a malicious build
        # can exfiltrate neither. Vetted artifacts are staged on build-dir for
        # the sign phase. Runs after scan so verdicts exist before it builds.
        - name: build
          image: registry.starnix.net/library/aur-builder@sha256:fa35f338811366586ec6f0acba9525c132f8bb5f3bf8997e3dd86849ccf6a8c0
          # Root inside gVisor (not on the node): installs deps, drops builds to 1000.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - /usr/local/bin/aur-build-all
          env:
            - name: BUILD_PHASE
              value: build
            - name: STATUS_DIR
              value: /status
            - name: REPO_DIR
              value: /repo
            - name: BUILD_DIR
              value: /build
            - name: ALLOWLIST
              value: /config/allowlist.yaml
            - name: REPO_NAME
              value: aur-mirror
            - name: TRIVY_FAIL_SEVERITY
              value: "HIGH,CRITICAL"
            - name: STATE_DIR
              value: /state
            - name: PUSHGATEWAY_URL
              value: "http://prometheus-pushgateway.monitoring.svc.cluster.local:9091"
            # No ANTHROPIC_API_KEY here: the Claude scan runs in the scan phase,
            # so untrusted build code never sees the key.
          volumeMounts:
            # Untrusted build code only READS the repo; only the signer writes.
            - name: repo
              mountPath: /repo
              readOnly: true
            - name: lock
              mountPath: /lock
            # Scan verdicts, read-only: the build phase never writes state.
            - name: state
              mountPath: /state
              readOnly: true
            - name: allowlist
              mountPath: /config
            - name: build-dir
              mountPath: /build
            - name: status
              mountPath: /status
          resources:
            requests:
              cpu: 2
              memory: 4Gi
              ephemeral-storage: 10Gi
            limits:
              cpu: 4
              memory: 12Gi
              ephemeral-storage: 50Gi
        # Phase 3 prep: import the GPG key into gpg-home (only the signer mounts
        # it), after the untrusted build init container has finished.
        - name: gpg-init
          image: registry.starnix.net/library/aur-builder@sha256:fa35f338811366586ec6f0acba9525c132f8bb5f3bf8997e3dd86849ccf6a8c0
          command:
            - sh
            - -c
            - |
              set -e
              export GNUPGHOME=/gpg/gnupg
              mkdir -p "$GNUPGHOME"
              chmod 700 "$GNUPGHOME"
              echo "$GPG_PRIVATE_KEY" | gpg --batch --import
              echo "GPG key imported: $GPG_KEY_ID"
          env:
            - name: GPG_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: aur-signing-key
                  key: GPG_PRIVATE_KEY
            - name: GPG_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aur-signing-key
                  key: GPG_KEY_ID
          volumeMounts:
            - name: gpg-home
              mountPath: /gpg
      containers:
        # Phase 3: sign + publish. Only container holding the key; runs no
        # PKGBUILD code. Reads staged artifacts, signs, repo-adds, pushes metrics.
        - name: signer
          image: registry.starnix.net/library/aur-builder@sha256:fa35f338811366586ec6f0acba9525c132f8bb5f3bf8997e3dd86849ccf6a8c0
          command:
            - /usr/local/bin/aur-build-all
          env:
            - name: BUILD_PHASE
              value: sign
            - name: STATUS_DIR
              value: /status
            - name: STATE_DIR
              value: /state
            - name: GNUPGHOME
              value: /gpg/gnupg
            - name: GPG_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aur-signing-key
                  key: GPG_KEY_ID
            - name: REPO_DIR
              value: /repo
            - name: BUILD_DIR
              value: /build
            - name: REPO_NAME
              value: aur-mirror
            - name: PUSHGATEWAY_URL
              value: "http://prometheus-pushgateway.monitoring.svc.cluster.local:9091"
          volumeMounts:
            # Signer is the ONLY writer of the published repo.
            - name: repo
              mountPath: /repo
            - name: lock
              mountPath: /lock
            - name: gpg-home
              mountPath: /gpg
            - name: build-dir
              mountPath: /build
            - name: status
              mountPath: /status
            # Verdicts + AUR metadata for the status page; read-only.
            - name: state
              mountPath: /state
              readOnly: true
          # The signer never runs PKGBUILD code or sudo, so it can be locked
          # down hard: no privilege escalation, no Linux capabilities.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 1
              memory: 2Gi
              ephemeral-storage: 5Gi
