# Global Alertmanager routing (referenced by alertmanagerSpec in
# kube-prometheus-stack.yaml). Everything goes to Discord; only a node
# being down also pages PagerDuty, which calls and texts.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager-routing
  namespace: monitoring
spec:
  route:
    receiver: discord
    groupBy: ['alertname', 'cluster', 'namespace']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
    routes:
      # Dead man's switch: the always-firing Watchdog is pushed to the
      # out-of-cluster watcher (Gatus jail on beastyboi), which alerts when
      # the pushes stop. Repeats every 2m; the watcher allows 10m of silence.
      - matchers:
          - name: alertname
            matchType: "="
            value: Watchdog
        receiver: watcher-heartbeat
        groupWait: 0s
        groupInterval: 1m
        repeatInterval: 2m
      - matchers:
          - name: alertname
            matchType: "="
            value: InfoInhibitor
        receiver: "null"
      - matchers:
          - name: alertname
            matchType: "=~"
            value: "KubeNodeNotReady|KubeNodeUnreachable"
        receiver: pagerduty
        groupBy: ['alertname', 'node']
        repeatInterval: 4h
        continue: true
      # A matched child route skips the root receiver, so node-down needs
      # its own Discord route
      - matchers:
          - name: alertname
            matchType: "=~"
            value: "KubeNodeNotReady|KubeNodeUnreachable"
        receiver: discord
        groupBy: ['alertname', 'node']
      - matchers:
          - name: severity
            matchType: "="
            value: info
        receiver: "null"
      - matchers:
          - name: alertname
            matchType: "=~"
            value: "KubeControllerManagerInstanceUnreachable|KubeSchedulerInstanceUnreachable"
        receiver: "null"
      - matchers:
          - name: alertname
            matchType: "="
            value: TargetDown
          - name: job
            matchType: "=~"
            value: "kube-controller-manager|kube-scheduler"
        receiver: "null"
  receivers:
    - name: "null"
    - name: watcher-heartbeat
      webhookConfigs:
        - url: http://192.168.1.60:8080/api/v1/endpoints/cluster_alertmanager-watchdog/external?success=true
          sendResolved: false
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: monitoring-secrets
                key: watcherPushToken
    - name: discord
      discordConfigs:
        - apiURL:
            name: monitoring-secrets
            key: discordWebhookUrl
          sendResolved: true
    - name: pagerduty
      pagerdutyConfigs:
        - routingKey:
            name: monitoring-secrets
            key: pagerdutyRoutingKey
          severity: critical
          sendResolved: true
  inhibitRules:
    - sourceMatch:
        - name: severity
          matchType: "="
          value: critical
      targetMatch:
        - name: severity
          matchType: "="
          value: warning
      equal: ['alertname', 'namespace']
