---
apiVersion: v1
kind: Namespace
metadata:
  name: semaphore
---
# semaphore-secrets: synced from OpenBao secret/cluster/semaphore-secrets via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: semaphore-secrets
  namespace: semaphore
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: semaphore-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/semaphore-secrets
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: semaphore-workdir-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  nfs:
    server: 192.168.1.75
    path: /mnt/Store/semaphore/workdir
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: semaphore-postgres-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  nfs:
    server: 192.168.1.75
    path: /mnt/Store/semaphore/postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: semaphore-workdir
  namespace: semaphore
spec:
  volumeName: semaphore-workdir-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: manual
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: semaphore-postgres
  namespace: semaphore
spec:
  volumeName: semaphore-postgres-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: manual
---
# Longhorn-backed replacements (migrated off NFS 2026-09-08: Postgres + the
# server workdir do not belong on NFS -- stale handles / locking). Dynamically
# provisioned; the old NFS PVs above stay (Retain) as rollback until verified.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: semaphore-postgres-lh
  namespace: semaphore
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: semaphore-workdir-lh
  namespace: semaphore
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: semaphore-postgres
  namespace: semaphore
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: semaphore-postgres
  template:
    metadata:
      labels:
        app: semaphore-postgres
    spec:
      securityContext:
        fsGroup: 70
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_DB
          value: semaphore
        - name: POSTGRES_USER
          value: semaphore
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: semaphore-secrets
              key: dbPassword
        - name: POSTGRES_INITDB_ARGS
          value: "--auth-host=scram-sha-256"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: pgdata
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command: [pg_isready, -U, semaphore]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: [pg_isready, -U, semaphore]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: semaphore-postgres-lh
---
apiVersion: v1
kind: Service
metadata:
  name: semaphore-postgres
  namespace: semaphore
spec:
  selector:
    app: semaphore-postgres
  ports:
  - port: 5432
    targetPort: 5432
