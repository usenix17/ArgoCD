---
# Serves aur.starnix.net: the signed pacman repo (read-only) and the status
# website. The page and nginx config come from site/ via kustomize
# configMapGenerator (kustomization.yaml); their content-hashed names roll
# this Deployment whenever the files change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aur-repo-server
  namespace: aur-mirror
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aur-repo-server
  template:
    metadata:
      labels:
        app: aur-repo-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: repo
          persistentVolumeClaim:
            claimName: aur-mirror-pvc
        - name: status
          persistentVolumeClaim:
            claimName: aur-mirror-status-pvc
        - name: ui
          configMap:
            name: aur-status-ui
        - name: nginx-config
          configMap:
            name: aur-nginx-config
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: nginx
          # nginx 1.31.7; unprivileged build runs as uid 101 on port 8080.
          image: nginxinc/nginx-unprivileged:1-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: repo
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: status
              mountPath: /usr/share/nginx/status
              readOnly: true
            - name: ui
              mountPath: /usr/share/nginx/ui
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: aur-repo-server
  namespace: aur-mirror
spec:
  selector:
    app: aur-repo-server
  ports:
    - port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aur-repo-ingress
  namespace: aur-mirror
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "AUR Mirror"
    gethomepage.dev/description: "Reviewed, built and signed AUR packages"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "archlinux.png"
    gethomepage.dev/href: "https://aur.starnix.net"
    gethomepage.dev/pod-selector: "app=aur-repo-server"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - aur.starnix.net
      secretName: aur-repo-tls
  rules:
    - host: aur.starnix.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aur-repo-server
                port:
                  number: 80
