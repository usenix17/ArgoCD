---
# 1. Namespace
# A dedicated namespace for Librespeed resources.
apiVersion: v1
kind: Namespace
metadata:
  name: librespeed
  labels:
    name: librespeed

---
# 2. Deployment
# Manages the Librespeed application pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librespeed
  namespace: librespeed
  labels:
    app: librespeed
spec:
  replicas: 3 # Converted from Nomad's "count = 3"
  selector:
    matchLabels:
      app: librespeed
  template:
    metadata:
      labels:
        app: librespeed
    spec:
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: librespeed
        image: lscr.io/linuxserver/librespeed:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Chicago"
        - name: PASSWORD
          value: "poopstain"
        - name: CUSTOM_RESULTS
          value: "true"
        resources:
          requests:
            cpu: 600m # 600 Nomad MHz is equivalent to 600m Kubernetes CPU
            memory: 1Gi # 1024 Nomad MB is equivalent to 1Gi Kubernetes memory
          limits:
            cpu: 600m
            memory: 1Gi
        volumeMounts:
        - name: config-volume
          mountPath: /config # Mount path inside the container
      volumes:
      # Ephemeral per-pod config. The linuxserver image regenerates /config on
      # start (nginx/php/keys/default www), so there's no durable data to keep.
      # Previously a single shared RWX Longhorn PVC across 3 replicas -> concurrent
      # writers racing on /config + Longhorn live-migration dual-controller wedge
      # when the replicas split across nodes. Per-pod emptyDir removes both risks.
      - name: config-volume
        emptyDir: {}

---
# 4. Service
# Exposes the Librespeed deployment internally to the cluster.
apiVersion: v1
kind: Service
metadata:
  name: librespeed-service
  namespace: librespeed
  labels:
    app: librespeed
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "LibreSpeed"
    gethomepage.dev/description: "Network Speed Test"
    gethomepage.dev/group: "Tools"
    gethomepage.dev/icon: "librespeed.png"
    gethomepage.dev/href: "https://speed.starnix.net"
spec:
  selector:
    app: librespeed
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
# 5. Ingress with NGINX and Cert-Manager
# Configures external access and automates SSL with cert-manager.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: librespeed-ingress
  namespace: librespeed
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "LibreSpeed"
    gethomepage.dev/description: "Network Speed Test"
    gethomepage.dev/group: "Tools"
    gethomepage.dev/icon: "librespeed.png"
    gethomepage.dev/href: "https://speed.starnix.net"
    gethomepage.dev/pod-selector: "app=librespeed"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - speed.starnix.net
    secretName: librespeed-tls-cert # cert-manager will create this secret
  rules:
  - host: speed.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: librespeed-service
            port:
              number: 80
