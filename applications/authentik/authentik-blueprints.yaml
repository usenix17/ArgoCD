  ldap-search.yaml: |
    # Authentik blueprint: let LDAP consumer service accounts ENUMERATE the directory.
    #
    # In Authentik 2026.5.3 the LDAP provider has no "search_group" field; a bound
    # account only sees objects it has RBAC view permission on (a normal user sees
    # just itself). So directory enumeration over the outpost requires granting the
    # bind accounts global view_user + view_group. We do that with a role bound to
    # the 'ldap-search' group.
    #
    # Members: svc_nsscache (nsscache), svc_jellyfin (Jellyfin). TrueNAS currently
    # binds as sasha (a superuser, already able to enumerate) -- move it to a
    # dedicated service account later and add that account here.
    version: 1
    metadata:
      name: ldap-search-enablement
    entries:
      - model: authentik_rbac.role
        id: ldap-read-role
        identifiers:
          name: ldap-directory-read
        attrs:
          permissions:
            # The 2024.8+ replacement for the LDAP provider "search group". This is
            # what lets bound service accounts enumerate the whole directory.
            # (Generic view_user/view_group do NOT grant LDAP enumeration.)
            - authentik_providers_ldap.search_full_directory
      - model: authentik_core.group
        identifiers:
          name: ldap-search
        attrs:
          roles:
            - !KeyOf ldap-read-role
          users:
            - !Find [authentik_core.user, [username, svc_nsscache]]
            - !Find [authentik_core.user, [username, svc_jellyfin]]
  pulse-oidc.yaml: |
    # Authentik blueprint: native OIDC for Pulse (pulse.starnix.net).
    # Pulse Community SSO is free (plain OIDC + allowed-groups + role mapping), so
    # this replaced the earlier forward-auth/proxy-provider approach -- no Traefik
    # middleware, and agent endpoints (/install.sh, /api/*) are naturally
    # unauthenticated at the proxy layer while Pulse guards them with API tokens.
    # client_secret is NOT set here: authentik autogenerates it on create and it
    # is copied ONCE into OpenBao cluster/pulse-secrets (never in git). Pulse
    # consumes it via env (OIDC_CLIENT_SECRET <- ESO). Pulse needs RS256, hence
    # the explicit signing_key. Issuer: https://auth.starnix.net/application/o/pulse/
    # Callback: https://pulse.starnix.net/api/oidc/callback (legacy env-var mode).
    version: 1
    metadata:
      name: pulse-oidc
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: pulse-oidc-provider
        identifiers:
          name: pulse-oidc
        attrs:
          client_type: confidential
          client_id: pulse
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://pulse.starnix.net/api/oidc/callback
      - model: authentik_core.application
        identifiers:
          slug: pulse
        attrs:
          name: Pulse
          provider: !KeyOf pulse-oidc-provider
          meta_launch_url: https://pulse.starnix.net
