---
apiVersion: v1
kind: Namespace
metadata:
  name: fleetdm
---
# Note: fleetdm-secrets must be created manually in the cluster:
# kubectl create secret generic fleetdm-secrets -n fleetdm \
#   --from-literal=mysql-root-password='YOUR_MYSQL_ROOT_PASSWORD' \
#   --from-literal=mysql-password='YOUR_FLEET_DB_PASSWORD' \
#   --from-literal=jwt-key='YOUR_JWT_KEY_HERE' \
#   --from-literal=server-private-key="$(openssl rand -base64 32)"
---
# MySQL Database
# PVC is dynamically provisioned by Longhorn (3 replicas, RWO).
# Current volume: pvc-b1008bce-6636-4b8b-9c42-7d05b01e4865
# Restored from mysqldump on 2026-06-13 after fleetdm-mysql-pre-incident
# volume entered a persistent degraded state (all replicas healthy=False).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: fleetdm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: fleetdm
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: fleetdm
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fleetdm-secrets
              key: mysql-root-password
        - name: MYSQL_DATABASE
          value: "fleet"
        - name: MYSQL_USER
          value: "fleet"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fleetdm-secrets
              key: mysql-password
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc
---
# Redis Cache
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: fleetdm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fleetdm
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fleetdm
spec:
  replicas: 1
  # Longhorn RWO PVC: RollingUpdate deadlocks on Multi-Attach (2026-09 audit).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command:
          - redis-server
          - --appendonly
          - "yes"
        ports:
        - containerPort: 6379
          name: redis
        volumeMounts:
        - name: redis-storage
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-pvc
---
# FleetDM Application
apiVersion: v1
kind: Service
metadata:
  name: fleet
  namespace: fleetdm
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "FleetDM"
    gethomepage.dev/description: "Device Management"
    gethomepage.dev/group: "Admin"
    gethomepage.dev/icon: "fleetdm.png"
    gethomepage.dev/href: "https://fleet.starnix.net"
spec:
  selector:
    app: fleet
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet
  namespace: fleetdm
spec:
  # Single replica: fleet is stateless (all state in MySQL/Redis), so one
  # pod is plenty for this homelab and avoids two replicas both loading the
  # DB. Was briefly scaled to 0 to let the mysql-pvc volume rebuild quietly.
  replicas: 1
  selector:
    matchLabels:
      app: fleet
  template:
    metadata:
      labels:
        app: fleet
    spec:
      initContainers:
      - name: fleet-prepare-db
        image: fleetdm/fleet:v4.60.0
        command:
          - /usr/bin/fleet
          - prepare
          - db
        env:
        - name: FLEET_MYSQL_ADDRESS
          value: "mysql:3306"
        - name: FLEET_MYSQL_DATABASE
          value: "fleet"
        - name: FLEET_MYSQL_USERNAME
          value: "fleet"
        - name: FLEET_MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fleetdm-secrets
              key: mysql-password
      containers:
      - name: fleet
        image: fleetdm/fleet:v4.60.0
        command:
          - /usr/bin/fleet
          - serve
        env:
        - name: FLEET_MYSQL_ADDRESS
          value: "mysql:3306"
        - name: FLEET_MYSQL_DATABASE
          value: "fleet"
        - name: FLEET_MYSQL_USERNAME
          value: "fleet"
        - name: FLEET_MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fleetdm-secrets
              key: mysql-password
        - name: FLEET_REDIS_ADDRESS
          value: "redis:6379"
        - name: FLEET_SERVER_ADDRESS
          value: "0.0.0.0:8080"
        - name: FLEET_AUTH_JWT_KEY
          valueFrom:
            secretKeyRef:
              name: fleetdm-secrets
              key: jwt-key
        - name: FLEET_SERVER_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: fleetdm-secrets
              key: server-private-key
        - name: FLEET_LOGGING_JSON
          value: "true"
        - name: FLEET_SERVER_TLS
          value: "false"
        ports:
        - containerPort: 8080
          name: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          # /healthz pings MySQL+Redis; the k8s default timeout of 1s is too
          # tight and kills the pod on transient DB latency. Allow 5s and
          # require sustained failure (~50s) before restarting.
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleet-ingress
  namespace: fleetdm
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-https@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "FleetDM"
    gethomepage.dev/description: "Device Management"
    gethomepage.dev/group: "Admin"
    gethomepage.dev/icon: "fleetdm.png"
    gethomepage.dev/href: "https://fleet.starnix.net"
    gethomepage.dev/pod-selector: "app=fleet"
spec:
  ingressClassName: traefik
  rules:
  - host: fleet.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fleet
            port:
              number: 8080
  tls:
  - hosts:
    - fleet.starnix.net
    secretName: fleet-tls
---
# fleetdm-secrets: synced from OpenBao secret/cluster/fleetdm-secrets via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleetdm-secrets
  namespace: fleetdm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: fleetdm-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/fleetdm-secrets
