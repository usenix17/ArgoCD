apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - storage.yaml
  - secrets.yaml
  - allowlist.yaml
  - networkpolicy.yaml
  - repo-server.yaml
  - builder.yaml
  - builder-hook.yaml
# The status website and nginx config are real files under site/. Generated
# ConfigMap names carry a content hash, so editing them rolls the repo-server.
configMapGenerator:
  - name: aur-status-ui
    namespace: aur-mirror
    files:
      - site/index.html
      - site/app.js
      - site/app.css
      - site/favicon.svg
  - name: aur-nginx-config
    namespace: aur-mirror
    files:
      - site/nginx/default.conf
      - site/nginx/headers.inc
