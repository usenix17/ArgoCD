---
# NFS-backed PV on mimir — same pattern as harbor-registry.
# Create the directory first: mkdir -p /mnt/Store/aur-mirror/repo
apiVersion: v1
kind: PersistentVolume
metadata:
  name: aur-mirror-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  nfs:
    server: 192.168.1.75
    path: /mnt/Store/aur-mirror/repo

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aur-mirror-pvc
  namespace: aur-mirror
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: manual
  volumeName: aur-mirror-pv
  resources:
    requests:
      storage: 20Gi

---
# Tiny coordination volume holding only the build flock. Separate from the repo
# so the untrusted build phase can mount /repo read-only (least privilege) while
# both phases still serialize on the lock here.
# Create the directory first: mkdir -p /mnt/Store/aur-mirror/lock
apiVersion: v1
kind: PersistentVolume
metadata:
  name: aur-mirror-lock-pv
spec:
  capacity:
    storage: 1Mi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  nfs:
    server: 192.168.1.75
    path: /mnt/Store/aur-mirror/lock

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aur-mirror-lock-pvc
  namespace: aur-mirror
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: manual
  volumeName: aur-mirror-lock-pv
  resources:
    requests:
      storage: 1Mi

---
# Scan-state volume: holds verdicts.json ({pkg: {commit, recipe_sha256,
# verdict, ...}}), written by the scan phase and read by the build phase.
# Replaces the old git-committed aur-lock.configmap.yaml -- state lives here,
# in-cluster, so no repo-write credential is ever needed. RWX (NFS, same as the
# repo/lock volumes) so the hourly CronJob and the PostSync hook pod can both
# mount it without RWO attach conflicts across nodes.
# Create the directory first: mkdir -p /mnt/Store/aur-mirror/state
apiVersion: v1
kind: PersistentVolume
metadata:
  name: aur-mirror-state-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  nfs:
    server: 192.168.1.75
    path: /mnt/Store/aur-mirror/state

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aur-mirror-state-pvc
  namespace: aur-mirror
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: manual
  volumeName: aur-mirror-state-pv
  resources:
    requests:
      storage: 1Gi

---
# Status volume: public files for the mirror website (https://aur.starnix.net),
# served read-only by the repo-server under /status/. Holds live.json (updated
# by every phase), per-package scan/build logs under logs/<run>/ (kept 30 days),
# and packages.json / runs.json (written by the signer at the end of a run).
# The build container runs untrusted PKGBUILD code and can write here, so the
# site treats every file as data: JSON/plain text only, rendered as text.
# Create the directory first:
#   mkdir -p /mnt/Store/aur-mirror/status && chown 1000:1000 /mnt/Store/aur-mirror/status
apiVersion: v1
kind: PersistentVolume
metadata:
  name: aur-mirror-status-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  nfs:
    server: 192.168.1.75
    path: /mnt/Store/aur-mirror/status

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aur-mirror-status-pvc
  namespace: aur-mirror
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: manual
  volumeName: aur-mirror-status-pv
  resources:
    requests:
      storage: 5Gi
