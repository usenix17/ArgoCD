apiVersion: v1
kind: ConfigMap
metadata:
  name: aur-allowlist
  namespace: aur-mirror
data:
  allowlist.yaml: |
    # Approved AUR packages mirrored by aur-mirror.
    # Baseline generated from selene's installed AUR footprint (pacman -Qmq,
    # excluding auto-generated -debug byproducts). The builder produces each
    # package's -debug variant automatically.
    #
    # This file is the approval gate: adding a package here (via PR) approves it.
    # The pipeline then Claude-scans its PKGBUILD every run and, if it passes,
    # builds AUR HEAD, Trivy-scans, signs, and publishes -- auto-updating as long
    # as it keeps passing (no lockfile, no per-bump review; see SCANNING.md).
    # A scan/Trivy/build failure HOLDS the package (keeps its last-good build +
    # alerts) without failing the run. -debug entries must NOT be listed; they
    # are built alongside their base. Set approved: false to hold a package.
    packages:
      - name: accounts-qml-module
        approved: true
        note: dependency
      - name: backblaze-b2-bin
        approved: true
        note: explicit
      - name: beautyline
        approved: true
