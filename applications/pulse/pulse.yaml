---
# Pulse server: unified monitoring dashboard (Proxmox + k8s + Docker).
# Web UI + agent endpoint on :7655. State/config on Longhorn (NOT NFS).
# Proxmox nodes are added post-deploy in the web UI with a read-only API token.
# pulse-secrets (OpenBao secret/cluster/pulse-secrets) holds API_TOKENS -- the
# shared token agents present as PULSE_TOKEN. Seed it before first sync:
#   vault kv put secret/cluster/pulse-secrets API_TOKENS="<generate a long token>"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pulse-secrets
  namespace: pulse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: pulse-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/pulse-secrets
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulse-data
  namespace: pulse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi            # headroom for the metrics SQLite (online-expandable)
  # SINGLE-REPLICA -- deliberate exception to the "always 3 replicas" rule.
  # pulse writes metrics to SQLite continuously; at 3x replication over WireGuard
  # each write was ~16ms -> 1.6-2.9s INSERTs -> the UI/readiness timed out and
  # pulse was effectively down. One replica = local writes (~3ms) and it serves
  # fine. The data is regenerable metrics + small config, so the redundancy trade
  # is acceptable. The StorageClass below is the 3-replica default, so the replica
  # count is pinned on the LIVE Longhorn volume (the PVC can't be recreated onto a
  # 1-replica SC without losing the /data config), together with dataLocality
  # best-effort so that single replica sits on the pod's node = local writes.
  # Re-apply both if the volume is ever recreated:
  #   kubectl -n longhorn-system patch volumes.longhorn.io <pv-name> --type merge \
  #     -p '{"spec":{"numberOfReplicas":1,"dataLocality":"best-effort"}}'
  storageClassName: longhorn
---
# pulse system settings, GitOps-managed. The initContainer below copies this onto
# the PVC at /data/system.json on every boot, so THIS is the source of truth --
# edit settings here, not in the pulse UI (UI changes to these revert on restart).
# Keeps pulse config declarative + recoverable if the /data volume is ever lost.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-system-config
  namespace: pulse
data:
  system.json: |
    {
        "pvePollingInterval": 10,
        "pbsPollingInterval": 60,
        "pmgPollingInterval": 60,
        "connectionTimeout": 10,
        "updateChannel": "stable",
        "autoUpdateEnabled": false,
        "discoveryEnabled": true,
        "discoverySubnet": "192.168.7.0/24",
        "discoveryConfig": {
            "environment_override": "auto",
            "subnet_blocklist": [
                "169.254.0.0/16"
            ],
            "max_hosts_per_scan": 1024,
            "max_concurrent": 50,
            "enable_reverse_dns": true,
            "scan_gateways": true,
            "dial_timeout_ms": 1000,
            "http_timeout_ms": 2000
        },
        "fullWidthMode": false,
        "allowEmbedding": false,
        "temperatureMonitoringEnabled": true,
        "dnsCacheTimeout": 300,
        "hideLocalLogin": false,
        "disableDockerUpdateActions": false,
        "enableProxmoxGuestDockerInventory": false,
        "metricsRetentionDailyDays": 30
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse
  namespace: pulse
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO Longhorn PVC -- avoid Multi-Attach on upgrade
  selector:
    matchLabels:
      app: pulse
  template:
    metadata:
      labels:
        app: pulse
    spec:
      securityContext:
        fsGroup: 1000          # let the server write /data
      initContainers:
        # Seed GitOps-managed system settings onto the PVC before pulse starts, so
        # system.json is declarative + recoverable. chown so pulse (uid 1000) can
        # still rewrite it at runtime (it reverts to this ConfigMap on next boot).
        - name: seed-system-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - cp /seed/system.json /data/system.json && chown 1000:1000 /data/system.json
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: system-config-seed, mountPath: /seed }
      containers:
        - name: pulse
          image: rcourtman/pulse:v6.4.1
          ports:
            - { name: http, containerPort: 7655 }
          env:
            - name: API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: pulse-secrets
                  key: API_TOKENS
            # Native OIDC against Authentik (Community SSO; env vars lock the
            # SSO fields in the UI = GitOps-owned). Secret lives in OpenBao
            # cluster/pulse-secrets; provider is blueprint-managed (pulse-oidc).
            - name: OIDC_ISSUER_URL
              value: "https://auth.starnix.net/application/o/pulse/"
            - name: OIDC_CLIENT_ID
              value: "pulse"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pulse-secrets
                  key: OIDC_CLIENT_SECRET
            # Explicit username claim (matches Pulse's default; pinned so the UI
            # never falls back to the sub UUID again).
            - name: OIDC_USERNAME_CLAIM
              value: "preferred_username"
            # Behind TLS-terminating Traefik: without this Pulse builds its OIDC
            # redirect_uri as http:// (Authentik then 400s on redirect_uri).
            - name: PULSE_PUBLIC_URL
              value: "https://pulse.starnix.net"
            # Trust X-Forwarded-* only from the pod network (Traefik).
            - name: PULSE_TRUSTED_PROXY_CIDRS
              value: "10.244.0.0/16"
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /, port: 7655 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5       # / can be slow under SQLite load; 1s default flapped it
            failureThreshold: 6     # tolerate heavy startup DB maintenance
          resources:
            # 512Mi OOMKilled once real load arrived (5-node PVE + host agents +
            # 5 k8s agents flushing buffers into the SQLite metrics store).
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: system-config-seed
          configMap:
            name: pulse-system-config
        - name: data
          persistentVolumeClaim:
            claimName: pulse-data
---
apiVersion: v1
kind: Service
metadata:
  name: pulse
  namespace: pulse
  labels:
    app: pulse
spec:
  selector:
    app: pulse
  ports:
    - { name: http, port: 7655, targetPort: 7655 }
---
# Auth is native OIDC in Pulse itself (see OIDC_* env on the Deployment) -- no
# Traefik forward-auth layer, so agent endpoints (/install.sh, /api/*) work
# without SSO exclusions and are guarded by Pulse's own API tokens.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse
  namespace: pulse
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: pulse.starnix.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulse
                port:
                  number: 7655
  tls:
    - secretName: pulse-tls
      hosts:
        - pulse.starnix.net
