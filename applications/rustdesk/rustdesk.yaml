---
# hbbs - ID/rendezvous server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustdesk-hbbs
  namespace: rustdesk
spec:
  replicas: 1
  # Longhorn RWO PVC: RollingUpdate deadlocks on Multi-Attach (2026-09 audit).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustdesk-hbbs
  template:
    metadata:
      labels:
        app: rustdesk-hbbs
    spec:
      containers:
      - name: hbbs
        image: rustdesk/rustdesk-server-pro:latest
        command: ["hbbs"]
        args: ["-r", "hbbr.starnix.net:21117"]
        ports:
        - containerPort: 21114
          protocol: TCP
        - containerPort: 21115
          protocol: TCP
        - containerPort: 21116
          protocol: TCP
        - containerPort: 21116
          protocol: UDP
        volumeMounts:
        - name: data
          mountPath: /root
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rustdesk-hbbs-data

---
# hbbr - relay server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustdesk-hbbr
  namespace: rustdesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustdesk-hbbr
  template:
    metadata:
      labels:
        app: rustdesk-hbbr
    spec:
      containers:
      - name: hbbr
        image: rustdesk/rustdesk-server-pro:latest
        command: ["hbbr"]
        ports:
        - containerPort: 21117
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi

---
# hbbs service - ports for ID/rendezvous server
apiVersion: v1
kind: Service
metadata:
  name: rustdesk-hbbs
  namespace: rustdesk
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.7.221"
    metallb.universe.tf/allow-shared-ip: "rustdesk"
    external-dns.alpha.kubernetes.io/hostname: hbbs.starnix.net
spec:
  type: LoadBalancer
  selector:
    app: rustdesk-hbbs
  ports:
  - name: nat-test
    port: 21115
    targetPort: 21115
    protocol: TCP
  - name: id-tcp
    port: 21116
    targetPort: 21116
    protocol: TCP
  - name: id-udp
    port: 21116
    targetPort: 21116
    protocol: UDP

---
# hbbr service - ports for relay server
apiVersion: v1
kind: Service
metadata:
  name: rustdesk-hbbr
  namespace: rustdesk
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.7.221"
    metallb.universe.tf/allow-shared-ip: "rustdesk"
    external-dns.alpha.kubernetes.io/hostname: hbbr.starnix.net
spec:
  type: LoadBalancer
  selector:
    app: rustdesk-hbbr
  ports:
  - name: relay
    port: 21117
    targetPort: 21117
    protocol: TCP

---
# Web console service + ingress
apiVersion: v1
kind: Service
metadata:
  name: rustdesk-webconsole
  namespace: rustdesk
spec:
  selector:
    app: rustdesk-hbbs
  ports:
  - name: webconsole
    port: 21114
    targetPort: 21114
    protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustdesk-webconsole
  namespace: rustdesk
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "RustDesk"
    gethomepage.dev/description: "Remote Desktop"
    gethomepage.dev/group: "Tools"
    gethomepage.dev/icon: "rustdesk.png"
    gethomepage.dev/href: "https://rustdesk.starnix.net"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - rustdesk.starnix.net
    secretName: rustdesk-webconsole-tls
  rules:
  - host: rustdesk.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rustdesk-webconsole
            port:
              number: 21114

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustdesk-hbbs-data
  namespace: rustdesk
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
