---
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare
---
# cloudflare-secrets: synced from OpenBao secret/cluster/cloudflared-secrets via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-secrets
  namespace: cloudflare
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cloudflare-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/cloudflared-secrets
---
