apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 86.0.0
    helm:
      releaseName: monitoring
      values: |
        prometheus:
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-production
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
            hosts:
              - prometheus.starnix.net
            paths:
              - /
            pathType: Prefix
            tls:
              - secretName: prometheus-tls
                hosts:
                  - prometheus.starnix.net
          prometheusSpec:
            enableRemoteWriteReceiver: true
            retention: 30d
            # WAL and chunks_head on emptyDir to keep compaction I/O off NFS
            volumes:
              - name: prometheus-wal
                emptyDir: {}
              - name: prometheus-chunks-head
                emptyDir: {}
            volumeMounts:
              - name: prometheus-wal
                mountPath: /prometheus/wal
              - name: prometheus-chunks-head
                mountPath: /prometheus/chunks_head
            # Strategic merge patch to increase probe timeouts for NFS-backed storage
            containers:
              - name: prometheus
                livenessProbe:
                  httpGet:
                    path: /-/healthy
                    port: http-web
                    scheme: HTTP
                  timeoutSeconds: 30
                  periodSeconds: 5
                  failureThreshold: 10
                readinessProbe:
                  httpGet:
                    path: /-/ready
                    port: http-web
                    scheme: HTTP
                  timeoutSeconds: 30
                  periodSeconds: 5
                  failureThreshold: 10
            storageSpec:
              volumeClaimTemplate:
                metadata:
                  name: prometheus-db
                spec:
                  storageClassName: manual
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 50Gi

        alertmanager:
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-production
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
            hosts:
              - alertmanager.starnix.net
            paths:
              - /
            pathType: Prefix
            tls:
              - secretName: alertmanager-tls
                hosts:
                  - alertmanager.starnix.net
          config:
            global:
              resolve_timeout: 5m
              pagerduty_url: https://events.pagerduty.com/v2/enqueue
            route:
              group_by: ['alertname', 'cluster', 'namespace']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              receiver: pagerduty
              routes:
                - matchers:
                    - alertname = Watchdog
                  receiver: "null"
                - matchers:
                    - alertname = InfoInhibitor
                  receiver: "null"
                - matchers:
                    - severity = info
                  receiver: "null"
                - matchers:
                    - alertname =~ "KubeControllerManagerInstanceUnreachable|KubeSchedulerInstanceUnreachable|KubeProxyInstanceUnreachable"
                  receiver: "null"
                - matchers:
                    - alertname = TargetDown
                    - job =~ "kube-controller-manager|kube-scheduler|kube-proxy"
                  receiver: "null"
            receivers:
              - name: "null"
              - name: pagerduty
                pagerduty_configs:
                  - routing_key_file: /etc/alertmanager/secrets/monitoring-secrets/pagerdutyRoutingKey
                    send_resolved: true
              # Discord: webhook_url_file not supported by prometheus-operator v0.91 schema.
              # Add a separate discord receiver via alertmanager.starnix.net UI or use webhook_url inline.
            inhibit_rules:
              - source_matchers:
                  - severity = critical
                target_matchers:
                  - severity = warning
                equal: ['alertname', 'namespace']
          alertmanagerSpec:
            secrets:
              - monitoring-secrets
            storage:
              volumeClaimTemplate:
                metadata:
                  name: alertmanager-db
                spec:
                  storageClassName: manual
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 5Gi

        grafana:
          # Longhorn RWO PVC: RollingUpdate deadlocks on Multi-Attach
          # (2026-09 audit). Grafana subchart key is deploymentStrategy.
          deploymentStrategy:
            type: Recreate
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-production
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              gethomepage.dev/enabled: "true"
              gethomepage.dev/name: "Grafana"
              gethomepage.dev/description: "Metrics & Logs"
              gethomepage.dev/group: "Admin"
              gethomepage.dev/icon: "grafana.png"
              gethomepage.dev/href: "https://grafana.starnix.net"
            hosts:
              - grafana.starnix.net
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.starnix.net

          persistence:
            enabled: true
            storageClassName: longhorn
            size: 5Gi

          admin:
            existingSecret: monitoring-secrets
            userKey: grafanaAdminUser
            passwordKey: grafanaAdminPassword

          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
              secretKeyRef:
                name: monitoring-secrets
                key: grafanaOidcClientId
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: monitoring-secrets
                key: grafanaOidcClientSecret

          grafana.ini:
            server:
              root_url: https://grafana.starnix.net
            auth:
              oauth_auto_login: false
              disable_login_form: false
            auth.generic_oauth:
              enabled: true
              name: Authentik
              allow_sign_up: true
              auto_login: false
              client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
              client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
              scopes: openid profile email
              auth_url: https://auth.starnix.net/application/o/authorize/
              token_url: https://auth.starnix.net/application/o/token/
              api_url: https://auth.starnix.net/application/o/userinfo/
              signout_redirect_url: https://auth.starnix.net/application/o/grafana/end-session/
              role_attribute_path: "contains(groups[*], 'grafana-admins') && 'Admin' || email == 'sasha@starnix.net' && 'Admin' || 'Viewer'"

        # Keep node-exporter and kube-state-metrics enabled (default)
        nodeExporter:
          enabled: true

        kubeStateMetrics:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
