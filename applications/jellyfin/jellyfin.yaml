---
# 4. Deployment
# Manages the Jellyfin application pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
spec:
  replicas: 1
  # RWO Longhorn config volume: terminate the old pod (release the volume)
  # before starting the new one, to avoid Multi-Attach stalls on rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # Pod-level security context
      securityContext:
        fsGroup: 105
        # Only recursively chown the volume when the top-level dir ownership
        # doesn't already match fsGroup. Without this, every pod restart chowns
        # the entire 20Gi config volume (33k+ metadata files), stalling the pod
        # in ContainerCreating for minutes and making Argo appear to hang.
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [44, 105]
      hostNetwork: false
      dnsPolicy: ClusterFirst
      # Pins plugin versions and restores plugin config from git on every
      # start; see plugin-config.yaml. ConfigMap edits apply on the next
      # restart (kubectl -n jellyfin rollout restart deploy/jellyfin).
      initContainers:
      - name: plugin-reconcile
        image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
        command: ["sh", "/plugin-config/reconcile.sh"]
        env:
        - name: LDAP_BIND_PASSWORD
          valueFrom:
            secretKeyRef:
              name: jellyfin-secrets
              key: ldap_bind_password
              optional: true
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: jellyfin-secrets
              key: client_secret
              optional: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: config-volume
          mountPath: "/config"
        - name: plugin-config
          mountPath: "/plugin-config"
          readOnly: true
      containers:
      - name: jellyfin
        # Pinned: the unpinned tag moved Jellyfin 10.11 -> 12.4 unattended
        # on 2026-10-29 and pulled ABI-12 plugins in with it. Bump on purpose,
        # together with plugins.list in plugin-config.yaml.
        image: jellyfin/jellyfin:12.4.20261026-211555@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
        ports:
        - containerPort: 8096
          name: http
        env:
        - name: JELLYFIN_DATA_DIR
          value: "/config/data"
        - name: JELLYFIN_TEMP_DIR
          value: "/transcode"
        - name: LIBVA_DRIVER_NAME
          value: "iHD"
        # Container-level security context
        securityContext:
          privileged: true
        resources:
          limits:
            cpu: 12000m
            memory: 12Gi
          requests:
            cpu: 200m
            memory: 4Gi
          # GPU temporarily disabled - no Intel i915 GPU available on cluster nodes
          # Uncomment when GPU nodes are available:
          # limits:
          #   gpu.intel.com/i915: 1
        volumeMounts:
        - name: scratch-volume
          mountPath: "/transcode"
        - name: config-volume
          mountPath: "/config"
        - name: series-volume
          mountPath: "/tv"
        - name: movies-volume
          mountPath: "/movies"
        - name: old-tv-volume
          mountPath: "/old/tv"
        - name: old-movies-volume
          mountPath: "/old/movies"
        - name: music-volume
          mountPath: "/Music"
        - name: new-music-volume
          mountPath: "/new/Music"
        - name: dev-dri
          mountPath: /dev/dri
      volumes:
      - name: scratch-volume
        emptyDir:
          medium: Memory
          sizeLimit: 20Gi
      - name: config-volume
        persistentVolumeClaim:
          claimName: jellyfin-config-longhorn-pvc
      - name: plugin-config
        configMap:
          name: jellyfin-plugin-config
      - name: series-volume
        persistentVolumeClaim:
          claimName: jellyfin-series-pvc
      - name: movies-volume
        persistentVolumeClaim:
          claimName: jellyfin-movies-pvc
      - name: old-tv-volume
        persistentVolumeClaim:
          claimName: jellyfin-old-tv-pvc
      - name: old-movies-volume
        persistentVolumeClaim:
          claimName: jellyfin-old-movies-pvc
      - name: music-volume
        persistentVolumeClaim:
          claimName: jellyfin-music-pvc
      - name: new-music-volume
        persistentVolumeClaim:
          claimName: jellyfin-new-music-pvc
      - name: dev-dri
        hostPath:
          path: /dev/dri
          type: DirectoryOrCreate
---
# 5. Service (MetalLB LoadBalancer)
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: jellyfin
  labels:
    app: jellyfin
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.7.208"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Jellyfin"
    gethomepage.dev/description: "Media Server"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "jellyfin.png"
    gethomepage.dev/href: "https://jellyfin.starnix.net"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: jellyfin
  ports:
  - port: 8096
    targetPort: 8096
    protocol: TCP
    name: http
---
# 6. Ingress (Traefik)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin-ingress
  namespace: jellyfin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-https@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Jellyfin"
    gethomepage.dev/description: "Media Server"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "jellyfin.png"
    gethomepage.dev/href: "https://jellyfin.starnix.net"
    gethomepage.dev/pod-selector: "app=jellyfin"
spec:
  ingressClassName: traefik
  rules:
  - host: jellyfin.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jellyfin-service
            port:
              number: 8096
  tls:
  - hosts:
    - jellyfin.starnix.net
    secretName: jellyfin-tls
---
# jellyfin-secrets: synced from OpenBao secret/cluster/jellyfin-secrets via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-secrets
  namespace: jellyfin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: jellyfin-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/jellyfin-secrets
---
# jellyfin-metrics-auth: synced from OpenBao secret/cluster/jellyfin-secrets via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-metrics-auth
  namespace: jellyfin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: jellyfin-metrics-auth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/jellyfin-secrets
---
# ConfigMap: prometheus-json-exporter module template.
# ${JELLYFIN_API_KEY} is substituted at pod start by the init container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-json-exporter-config
  namespace: jellyfin
data:
  config.yaml.tmpl: |
    modules:
      jellyfin:
        headers:
          Authorization: "MediaBrowser Token=${JELLYFIN_API_KEY}"
          Content-Type: application/json
          accept: application/json
        metrics:
        - name: jellyfin
          type: object
          help: User playback metrics from Jellyfin
          path: '{ [?(@.NowPlayingItem)] }'
          labels:
            user_name: '{ .UserName }'
            item_type: '{ .NowPlayingItem.Type }'
            item_name: '{ .NowPlayingItem.Name }'
            series_name: '{ .NowPlayingItem.SeriesName }'
            episode_index: 'e{ .NowPlayingItem.IndexNumber }'
            season_index: 's{ .NowPlayingItem.ParentIndexNumber }'
            client_name: '{ .Client }'
            device_name: '{ .DeviceName }'
            session_id: '{ .Id }'
          values:
            is_paused: '{ .PlayState.IsPaused }'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-json-exporter
  namespace: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin-json-exporter
  template:
    metadata:
      labels:
        app: jellyfin-json-exporter
    spec:
      initContainers:
      - name: config-init
        image: busybox:latest
        command: [sh, -c, 'sed "s|\${JELLYFIN_API_KEY}|$JELLYFIN_API_KEY|g" /tmpl/config.yaml.tmpl > /config/config.yaml']
        env:
        - name: JELLYFIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: jellyfin-secrets
              key: JELLYFIN_API_KEY
        volumeMounts:
        - name: config-tmpl
          mountPath: /tmpl
        - name: config
          mountPath: /config
      containers:
      - name: json-exporter
        image: quay.io/prometheuscommunity/json-exporter:latest
        args: ["--config.file=/config/config.yaml"]
        ports:
        - name: metrics
          containerPort: 7979
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: config-tmpl
        configMap:
          name: jellyfin-json-exporter-config
      - name: config
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-json-exporter
  namespace: jellyfin
  labels:
    app: jellyfin-json-exporter
spec:
  selector:
    app: jellyfin-json-exporter
  ports:
  - name: metrics
    port: 7979
    targetPort: 7979
---
# Native Jellyfin /metrics (enabled via system.xml EnableMetrics=true)
# Jellyfin 10.10+ requires "Authorization: MediaBrowser Token=<key>".
# The jellyfin-metrics-auth secret is produced by the VSO transformation above.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jellyfin-native
  namespace: jellyfin
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: jellyfin
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    authorization:
      type: MediaBrowser
      credentials:
        name: jellyfin-metrics-auth
        key: token
---
# Playback session metrics via prometheus-json-exporter + Jellyfin Sessions API
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jellyfin-sessions
  namespace: jellyfin
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: jellyfin-json-exporter
  endpoints:
  - port: metrics
    path: /probe
    interval: 30s
    params:
      module: [jellyfin]
      target: ['http://jellyfin-service.jellyfin.svc.cluster.local:8096/Sessions']
    relabelings:
    - sourceLabels: [__param_target]
      targetLabel: instance
