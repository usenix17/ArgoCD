---
apiVersion: v1
kind: Namespace
metadata:
  name: borgwarehouse
---
# Note: borgwarehouse-secrets must be created manually in the cluster:
# kubectl create secret generic borgwarehouse-secrets -n borgwarehouse \
#   --from-literal=NEXTAUTH_SECRET='YOUR_NEXTAUTH_SECRET' \
#   --from-literal=CRONJOB_KEY='YOUR_CRONJOB_KEY' \
#   --from-literal=MAIL_SMTP_PWD='YOUR_SMTP_PASSWORD'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: borgwarehouse-config
  namespace: borgwarehouse
data:
  # Kept as borg.starnix.net per your request
  NEXTAUTH_URL: "https://borgwarehouse.starnix.net"
  FQDN: "borg.starnix.net"
  SSH_SERVER_PORT: "2222"
  MAIL_SMTP_FROM: "info@starnix.net"
  MAIL_SMTP_HOST: "smtp.gmail.com"
  MAIL_SMTP_PORT: "465"
  MAIL_SMTP_LOGIN: "info@starnix.net"
  MAIL_REJECT_SELFSIGNED_TLS: "true"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: borgwarehouse-nfs-pv
spec:
  capacity:
    storage: 2Ti
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  mountOptions:
    # NFSv4.1. NOTE: this requires `vfs.nfsd.enable_stringtouid=1` on the NAS
    # (mimir, FreeBSD 15). Stock FreeBSD 15 defaults it to 0, so its NFSv4 idmapper
    # rejected the numeric owner IDs Linux clients send (BADOWNER -> chown "Invalid
    # argument"), which crashed borgwarehouse's chown steps. Fixed server-side
    # 2026-07-25 (set + persisted in /etc/sysctl.conf); if it ever regresses,
    # re-check that sysctl or fall back to nfsvers=3.
    - nfsvers=4.1
    - hard
    - timeo=600
    - retrans=2
  nfs:
    server: 192.168.1.75
    path: /mnt/Backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: borgwarehouse-nfs-pvc
  namespace: borgwarehouse
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: manual
  resources:
    requests:
      storage: 2Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: borgwarehouse-config
  namespace: borgwarehouse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: borgwarehouse
  namespace: borgwarehouse
spec:
  replicas: 1
  # Longhorn RWO PVC: RollingUpdate deadlocks on Multi-Attach (2026-09 audit).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: borgwarehouse
  template:
    metadata:
      labels:
        app: borgwarehouse
    spec:
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      securityContext:
        fsGroup: 1001
      initContainers:
      - name: chown-volumes
        image: busybox:latest
        command:
          - sh
          - -c
          - |
            # /mnt/config is a Longhorn ext4 RWO volume -- chown works here.
            chown -R 1000:1000 /mnt/config || true
            # The NFS dirs live on 192.168.1.75:/mnt/Backup (NFSv4.1, sec=sys). That
            # server rejects a numeric-owner SETATTR (BADOWNER -> "Invalid argument")
            # even for a no-op chown, so `chown -R` here always failed and crashed the
            # init container. Ownership is already correct (managed NAS-side; files are
            # created as 1000), so do a best-effort top-level chown only, tolerate the
            # NFSv4 rejection, and skip the pointless 2 TiB recursive walk over repos.
            chown 1000:1000 /mnt/ssh /mnt/ssh_host /mnt/repos /mnt/logs /mnt/tmp 2>/dev/null || true
        volumeMounts:
        - name: config-storage
          mountPath: /mnt/config
        - name: nfs-storage
          mountPath: /mnt/ssh
          subPath: ssh
        - name: nfs-storage
          mountPath: /mnt/ssh_host
          subPath: ssh_host
        - name: nfs-storage
          mountPath: /mnt/repos
          subPath: repos
        - name: nfs-storage
          mountPath: /mnt/logs
          subPath: logs
        - name: nfs-storage
          mountPath: /mnt/tmp
          subPath: tmp
      containers:
      - name: borgwarehouse
        image: borgwarehouse/borgwarehouse
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: web
        - containerPort: 22
          name: ssh
        envFrom:
        - configMapRef: { name: borgwarehouse-config }
        - secretRef: { name: borgwarehouse-secrets }
        volumeMounts:
        - name: config-storage
          mountPath: /home/borgwarehouse/app/config
        - name: nfs-storage
          mountPath: /home/borgwarehouse/.ssh
          subPath: ssh
        - name: nfs-storage
          mountPath: /etc/ssh
          subPath: ssh_host
        - name: nfs-storage
          mountPath: /home/borgwarehouse/repos
          subPath: repos
        - name: nfs-storage
          mountPath: /home/borgwarehouse/logs
          subPath: logs
        - name: nfs-storage
          mountPath: /home/borgwarehouse/tmp
          subPath: tmp
        - name: run-dir
          mountPath: /run
      volumes:
      - name: config-storage
        persistentVolumeClaim:
          claimName: borgwarehouse-config
      - name: nfs-storage
        persistentVolumeClaim:
          claimName: borgwarehouse-nfs-pvc
      - name: run-dir
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: borgwarehouse-svc
  namespace: borgwarehouse
  annotations:
    # MetalLB Dedicated IP for SSH
    metallb.universe.tf/loadBalancerIPs: "192.168.7.209"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "BorgWarehouse"
    gethomepage.dev/description: "Backup Repository Manager"
    gethomepage.dev/group: "Backup"
    gethomepage.dev/icon: "mdi-harddisk"
    gethomepage.dev/href: "https://borgwarehouse.starnix.net"
spec:
  type: LoadBalancer
  # Preserve the real client IP (no SNAT) so sshd logs + Graylog alerts show the
  # actual source, not the Cilium proxy IP. MetalLB announces the LB IP only from
  # the node running the pod.
  externalTrafficPolicy: Local
  selector:
    app: borgwarehouse
  ports:
  - port: 3000
    targetPort: 3000
    name: web
  - port: 2222
    targetPort: 22
    name: ssh
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: borgwarehouse-ingress
  namespace: borgwarehouse
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "BorgWarehouse"
    gethomepage.dev/description: "Backup Repository Manager"
    gethomepage.dev/group: "Backup"
    gethomepage.dev/icon: "mdi-harddisk"
    gethomepage.dev/href: "https://borgwarehouse.starnix.net"
    gethomepage.dev/pod-selector: "app=borgwarehouse"
spec:
  ingressClassName: traefik
  rules:
  # Traefik listens for borgwarehouse.starnix.net
  - host: borgwarehouse.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: borgwarehouse-svc
            port: { number: 3000 }
  tls:
  - hosts: ["borgwarehouse.starnix.net"]
    secretName: borgwarehouse-tls-prod
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: borgwarehouse-cron
  namespace: borgwarehouse
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: cron
            image: curlimages/curl
            command:
            - sh
            - -c
            - |
              curl -s -X POST http://borgwarehouse-svc:3000/api/v1/cron/status -H "Authorization: Bearer $CRONJOB_KEY" &&
              curl -s -X POST http://borgwarehouse-svc:3000/api/v1/cron/storage -H "Authorization: Bearer $CRONJOB_KEY"
            env:
            - name: CRONJOB_KEY
              valueFrom:
                secretKeyRef:
                  name: borgwarehouse-secrets
                  key: CRONJOB_KEY
          restartPolicy: OnFailure
---
# borgwarehouse-secrets: synced from OpenBao secret/cluster/borgwarehouse-secrets via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: borgwarehouse-secrets
  namespace: borgwarehouse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: borgwarehouse-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/borgwarehouse-secrets
