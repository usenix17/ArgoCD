---
# Manager /var/ossec/queue on Longhorn (block), NOT NFS: it holds unix sockets
# and the SQLite agent DB (global.db = agent group memberships), neither of which
# works over NFS. Persisting it makes agent_groups assignments (e.g. vault's
# openbao group) survive manager restarts instead of resetting to the enrollment
# group. Longhorn default class = 3 replicas.
# Sized for the Vulnerability Detection database (queue/vd): the multi-distro CVE
# feed is several GB and grows over time. Peak usage during a feed update is the
# installed feed (queue/vd/feed ~11Gi) PLUS the updater scratch space
# (queue/vd_updater/tmp ~7.5Gi) PLUS wazuh-db/indexer (~2Gi). 5Gi then 20Gi both
# filled to 100% and wedged the daemons with "No space left on device", so 40Gi
# gives ~2x headroom over the ~20Gi update peak. CANNOT go on NFS (sockets+SQLite).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wazuh-manager-queue
  namespace: wazuh
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 40Gi
