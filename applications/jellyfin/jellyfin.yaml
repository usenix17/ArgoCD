---
# 1. Namespace
# A dedicated namespace for Jellyfin resources.
apiVersion: v1
kind: Namespace
metadata:
  name: jellyfin
  labels:
    name: jellyfin
---
# 2. PersistentVolumes (NFS)
# Defines all the NFS volumes for Jellyfin's configuration and media libraries.
# --------------------------------------------------------------------------

# Jellyfin config on Longhorn (3 replicas, RWO, dynamically provisioned).
# Config lives on a STATIC Longhorn PV (not dynamic) so it survives a PVC delete.
# Restored 2026-06-27 from the 02:00 backup after an ArgoCD prune+selfHeal during
# a control-plane node flap deleted the dynamic PVC and cascaded (reclaim=Delete)
# into wiping the volume. Lessons baked in here:
#   - persistentVolumeReclaimPolicy: Retain  -> a PVC delete never destroys data
#   - PV.claimRef + PVC has NO volumeName     -> avoids the ArgoCD volumeName diff
#     loop that was failing syncs (see fleetdm/README.md). The Application also
#     ignoreDifferences spec.volumeName / claimRef.uid as belt-and-suspenders.
# Underlying Longhorn volume: jellyfin-config-restored.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-config-restored-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  storageClassName: longhorn
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: jellyfin-config-longhorn-pvc
    namespace: jellyfin
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: jellyfin-config-restored-2
    volumeAttributes:
      numberOfReplicas: "3"
      staleReplicaTimeout: "30"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-longhorn-pvc
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
# Series Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-series-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: "192.168.1.86"
    path: "/media/completed/Series"
---
