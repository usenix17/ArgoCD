# Cilium Helm values for the Talos talos-default cluster.
#
# Migration from Flannel -- see tasks/cilium-migration.md. Bootstrapped via
# `helm install` (cilium-agent runs in the host netns, so it comes up before any
# CNI exists), then adopted into ArgoCD.
#
# Values follow the official Sidero "Cilium on Talos" guide:
#   https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium
#
# Pass 1 (kube-proxy retained) is complete; Pass 2 (KPR) is now enabled:
# kubeProxyReplacement: true here + cluster.proxy.disabled: true in the Omni
# machine config (ConfigPatch 400-disable-kube-proxy) so Talos removes the
# kube-proxy DaemonSet and Cilium handles all service load-balancing in eBPF.

# Reuse the CIDRs Talos already allocates per node (10.244.0.0/16) -- no
# renumbering, no conflict with the outgoing Flannel ranges.
ipam:
  mode: kubernetes

# --- Transparent encryption (WireGuard) ---
# Encrypts pod-to-pod traffic BETWEEN nodes. The data plane rides the shared
# 192.168.7.0/24 VLAN on the Proxmox hypervisors (the Talos nodes are VMs on
# pve1-5), so this keeps east-west pod traffic unreadable to the hypervisor and
# anything else on that L2. North-south (pod -> LAN/NFS/internet, masqueraded to
# the node IP) stays cleartext, so the huginn NSM tap keeps its per-host/external
# flow visibility; only intra-cluster east-west becomes opaque (udp/51871).
# Talos ships the WireGuard kernel module; Cilium creates cilium_wg0 via NET_ADMIN
# (already granted above). node2node (host) encryption left default-off = pod-only.
# MTU: Cilium auto-subtracts VXLAN+WG overhead from the pod MTU (no manual MTU).
encryption:
  enabled: true
  type: wireguard

# --- MetalLB coexistence (CRITICAL) ---
# MetalLB owns LoadBalancer services (L2 mode, pool 192.168.7.206-250). Cilium
# ships with LB-IPAM enabled by default (enable-lb-ipam: true), which would arm
# a SECOND controller to hand out LoadBalancer IPs. Disable all of Cilium's
# service-LB features so MetalLB stays the sole owner -- no dueling announcers.
enableLBIPAM: false
loadBalancer:
  l2:
    enabled: false        # no Cilium L2 announcements (MetalLB does L2/ARP)
bgpControlPlane:
  enabled: false          # no Cilium BGP

# Pass 2 (KPR): Cilium fully replaces kube-proxy in eBPF. Paired with
# cluster.proxy.disabled: true in the Talos/Omni machine config (Talos then
# removes the kube-proxy DaemonSet). MetalLB still owns LoadBalancer IP
# announcement (its speaker is hostNetwork); Cilium KPR only handles the
# service datapath, including externalTrafficPolicy:Local source-IP preservation.
kubeProxyReplacement: true
# The agent's apiserver connection uses KubePrism (node-local LB, ~1s failover).
# This is required for KPR (the agent must reach the apiserver without kube-proxy)
# and is also what stopped control-plane reboots from flapping peer nodes (the
# agent's watch used to break via the kube-proxy ClusterIP path).
k8sServiceHost: localhost
k8sServicePort: 7445

# Talos-specific: Talos forbids workloads from loading kernel modules, so
# SYS_MODULE is DROPPED from Cilium's default agent capability set. Use this
# exact list (do not fall back to chart defaults, which include SYS_MODULE).
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Talos mounts the cgroup2 fs at /sys/fs/cgroup; Cilium must not try to mount it.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

operator:
  replicas: 2

# Hubble: flow observability (a reason for moving off Flannel). UI is reachable
# via port-forward for now; expose via Traefik later if wanted.
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
    # Exposed via Traefik at https://hubble.starnix.net (cert-manager TLS,
    # ExternalDNS publishes the record from the ingress).
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - hubble.starnix.net
      tls:
        - hosts:
            - hubble.starnix.net
          secretName: hubble-ui-tls
