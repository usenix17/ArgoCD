---
# Create secret before first sync:
# kubectl create secret generic gatus-secrets -n gatus \
#   --from-literal=discord-webhook-url="<discord webhook url>"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gatus
  namespace: gatus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gatus-reader
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "services", "endpoints"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list"]
- nonResourceURLs: ["/healthz", "/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gatus-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gatus-reader
subjects:
- kind: ServiceAccount
  name: gatus
  namespace: gatus
---
apiVersion: v1
kind: Namespace
metadata:
  name: gatus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus
data:
  config.yaml: |
    ui:
      title: "Starnix Services"
      header: "Starnix Services"

    metrics: true

    alerting:
      discord:
        webhook-url: "${DISCORD_WEBHOOK_URL}"
        default-alert:
          failure-threshold: 3
          send-on-resolved: true
      slack:
        webhook-url: "https://hooks.slack.com/services/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"

    endpoints:
      # ── Jellyfin ────────────────────────────────────────────────────────────
      - name: "Jellyfin"
        group: Jellyfin
        url: "https://jellyfin.starnix.net"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
      - name: "Overseerr"
        group: Jellyfin
        url: "https://media.starnix.net"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
      - name: "Radarr"
        group: Jellyfin
        url: "https://radarr.starnix.net"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
      - name: "Sonarr"
        group: Jellyfin
        url: "https://sonarr.starnix.net"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
      - name: "SABnzbd"
        group: Jellyfin
        url: "https://nzb.starnix.net"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord

      # ── Authentication ───────────────────────────────────────────────────────
      - name: "Authentik SSO"
        group: Authentication
        url: "https://auth.starnix.net"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord

      # ── Security ─────────────────────────────────────────────────────────────
      - name: "FleetDM"
        group: Security
        url: "https://fleet.starnix.net"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
      - name: "Borgwarehouse"
        group: Security
        url: "https://borgwarehouse.starnix.net"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord

      # ── Home ─────────────────────────────────────────────────────────────────
      - name: "Home Assistant"
        group: Home
        url: "https://ha.starnix.net"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
      - name: "Homepage"
        group: Home
        url: "https://home.starnix.net"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord

      # ── Services ─────────────────────────────────────────────────────────────
      - name: "Krampus (Santa Sync)"
        group: Services
        url: "http://krampus.krampus.svc.cluster.local/ping"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
      - name: "Kutt (URL Shortener)"
        group: Services
        url: "https://go.starnix.net"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
      - name: "PrivateBin"
        group: Services
        url: "https://privatebin.starnix.net"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
      - name: "LibreSpeed"
        group: Services
        url: "https://speed.starnix.net"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
      - name: "Stirling PDF"
        group: Services
        url: "https://pdf.starnix.net"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
      - name: "Freescout"
        group: Services
        url: "https://help.starnix.net"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
      - name: "Apprise"
        group: Services
        url: "https://apprise.starnix.net"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
      - name: "GTarot"
        group: Services
        url: "https://tarot.starnix.net"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
      - name: "Radiacode Analyzer"
        group: Services
        url: "https://radiacode.starnix.net"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
      - name: "Weather"
        group: Services
        url: "https://weather.starnix.net"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord

      # ── Cluster ──────────────────────────────────────────────────────────────
      - name: "ArgoCD"
        group: Cluster
        url: "https://argocd.starnix.net"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
      - name: "Longhorn UI"
        group: Cluster
        url: "https://longhorn.starnix.net"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
      - name: "Kubernetes API Server"
        group: Cluster
        url: "https://kubernetes.default.svc.cluster.local:443/healthz"
        interval: 30s
        client:
          timeout: 10s
          insecure: true
        conditions:
          - "[STATUS] == 401"
        alerts:
          - type: discord
      - name: "Cert-Manager"
        group: Cluster
        url: "http://cert-manager.cert-manager.svc.cluster.local:9402/metrics"
        interval: 1m
        client:
          timeout: 5s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
      - name: "Longhorn Storage (internal)"
        group: Cluster
        url: "http://longhorn-frontend.longhorn-system.svc.cluster.local:80"
        interval: 1m
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord

      # ── Infrastructure ───────────────────────────────────────────────────────
      - name: "Mimir NFS Server"
        group: Infrastructure
        url: "tcp://192.168.1.75:111"
        interval: 1m
        client:
          timeout: 5s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: discord
      - name: "PBX (Telephone)"
        group: Infrastructure
        url: "tcp://146.190.123.109:5060"
        interval: 1m
        client:
          timeout: 5s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: discord
      - name: "FreeIPA LDAP"
        group: Infrastructure
        url: "tcp://192.168.1.26:389"
        interval: 5m
        client:
          timeout: 5s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: discord

      # ── Mercer ───────────────────────────────────────────────────────────────
      - name: "bensonmasons.com"
        group: Mercer
        url: "https://bensonmasons.com"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: discord
          - type: slack
            failure-threshold: 5
            description: "healthcheck failed 5 times in a row"
            send-on-resolved: true

    storage:
      type: sqlite
      path: /storage/data.db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gatus-storage-pvc
  namespace: gatus
spec:
  storageClassName: longhorn
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: gatus
  labels:
    app: gatus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
    spec:
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      serviceAccountName: gatus
      containers:
      - name: gatus
        image: twinproduction/gatus:latest
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: gatus-config
          mountPath: /config
          readOnly: true
        - name: gatus-storage
          mountPath: /storage
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "600m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: GATUS_CONFIG_PATH
          value: /config/config.yaml
        - name: DISCORD_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: gatus-secrets
              key: discord-webhook-url
      volumes:
      - name: gatus-config
        configMap:
          name: gatus-config
      - name: gatus-storage
        persistentVolumeClaim:
          claimName: gatus-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gatus
  namespace: gatus
  labels:
    app: gatus
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Gatus"
    gethomepage.dev/description: "Service Status Monitor"
    gethomepage.dev/group: "Monitoring"
    gethomepage.dev/icon: "gatus.png"
    gethomepage.dev/href: "https://status.starnix.net"
spec:
  selector:
    app: gatus
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gatus-ingress
  namespace: gatus
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Gatus"
    gethomepage.dev/description: "Service Status Monitor"
    gethomepage.dev/group: "Monitoring"
    gethomepage.dev/icon: "gatus.png"
    gethomepage.dev/href: "https://status.starnix.net"
    gethomepage.dev/pod-selector: "app=gatus"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - status.starnix.net
    secretName: gatus-tls
  rules:
  - host: status.starnix.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gatus
            port:
              number: 80
---
# gatus-secrets: synced from OpenBao secret/cluster/gatus-secrets via ESO (ClusterSecretStore 'openbao').
# Migrated from a VSO VaultStaticSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-secrets
  namespace: gatus
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: gatus-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster/gatus-secrets
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gatus
  namespace: gatus
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: gatus
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
