# aur.starnix.net: the pacman repo plus its status website.
#   /            status page (site/ ConfigMap)
#   /assets/     page assets
#   /status/     status data written by the pipeline (untrusted: JSON/text only)
#   /browse/     file listing of the repo
#   /<file>      repo files for pacman (db, packages, signatures)
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    autoindex off;
    include /etc/nginx/conf.d/headers.inc;

    location = / {
        root /usr/share/nginx/ui;
        try_files /index.html =404;
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location /assets/ {
        alias /usr/share/nginx/ui/;
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # Written by the pipeline, including the untrusted build container: only
    # JSON and plain text, never rendered as HTML, sandboxed if opened directly.
    location /status/ {
        alias /usr/share/nginx/status/;
        types {
            application/json json;
        }
        default_type text/plain;
        charset utf-8;
        charset_types application/json text/plain;
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    location /browse/ {
        alias /usr/share/nginx/html/;
        autoindex on;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri =404;
    }
}
